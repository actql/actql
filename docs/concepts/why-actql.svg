<rect x="40" y="96" width="120" height="44" fill="#efeae3"/>
<text x="100" y="123" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a2e28">Snowflake</text>
<rect x="185" y="96" width="120" height="44" fill="#efeae3"/>
<text x="245" y="123" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a2e28">SQL</text>
<rect x="470" y="96" width="120" height="44" fill="#efeae3"/>
<text x="530" y="123" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a2e28">LLM SDK</text>
<rect x="300" y="170" width="160" height="44" fill="#efeae3"/>
<text x="380" y="197" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a2e28">Python / TypeScript</text>
<rect x="40" y="250" width="120" height="44" fill="#efeae3"/>
<text x="100" y="277" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a2e28">Salesforce</text>
<rect x="185" y="250" width="120" height="44" fill="#efeae3"/>
<text x="245" y="277" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a2e28">MCP / SDK</text>
<rect x="470" y="250" width="120" height="44" fill="#efeae3"/>
<text x="530" y="277" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a2e28">queue · state</text>
<rect x="300" y="324" width="160" height="44" fill="#efeae3"/>
<text x="380" y="351" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a2e28">workflow engine</text>
<rect x="185" y="406" width="120" height="44" fill="#efeae3"/>
<text x="245" y="433" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a2e28">your own approval</text>
<rect x="470" y="406" width="120" height="44" fill="#efeae3"/>
<text x="530" y="433" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3a2e28">Salesforce update</text>
<text x="40" y="492" font-size="12" fill="#6b625c">Example: judge churn risk with an LLM and, after approval, update Salesforce</text>
<rect x="640" y="84" width="600" height="372" fill="#efeae3"/>
<text x="662" y="124" font-size="13" font-weight="700" fill="#3a2e28">read</text>
<text x="740" y="124" font-size="15" font-family='Menlo, Consolas, "Noto Sans Mono", monospace' fill="#3a2e28" xml:space="preserve">FROM salesforce.accounts AS a</text>
<text x="662" y="156" font-size="13" font-weight="700" fill="#3a2e28">read</text>
<text x="740" y="156" font-size="15" font-family='Menlo, Consolas, "Noto Sans Mono", monospace' fill="#3a2e28" xml:space="preserve">JOIN snowflake.usage_30d AS u</text>
<text x="740" y="188" font-size="15" font-family='Menlo, Consolas, "Noto Sans Mono", monospace' fill="#3a2e28" xml:space="preserve">     ON a.id = u.account_id</text>
<text x="662" y="228" font-size="13" font-weight="700" fill="#3a2e28">infer</text>
<text x="740" y="228" font-size="15" font-family='Menlo, Consolas, "Noto Sans Mono", monospace' fill="#3a2e28" xml:space="preserve">|&gt; INFER `model-task:churn-risk.v1`</text>
<text x="740" y="260" font-size="15" font-family='Menlo, Consolas, "Noto Sans Mono", monospace' fill="#3a2e28" xml:space="preserve">     INPUT (notes, active_users, trend) AS risk</text>
<text x="662" y="300" font-size="13" font-weight="700" fill="#3a2e28">filter</text>
<text x="740" y="300" font-size="15" font-family='Menlo, Consolas, "Noto Sans Mono", monospace' fill="#3a2e28" xml:space="preserve">|&gt; WHERE risk.outcome = 'ok'</text>
<text x="740" y="332" font-size="15" font-family='Menlo, Consolas, "Noto Sans Mono", monospace' fill="#3a2e28" xml:space="preserve">     AND risk.value.level = 'high'</text>
<text x="662" y="372" font-size="13" font-weight="700" fill="#3a2e28">write</text>
<text x="740" y="372" font-size="15" font-family='Menlo, Consolas, "Noto Sans Mono", monospace' fill="#3a2e28" xml:space="preserve">|&gt; EFFECT UPDATE salesforce.Account</text>
<text x="740" y="404" font-size="15" font-family='Menlo, Consolas, "Noto Sans Mono", monospace' fill="#3a2e28" xml:space="preserve">     ID id SET (Churn_Risk__c = risk.value.level, …)</text>
<text x="640" y="492" font-size="13" font-weight="700" fill="#3a2e28">No separate code for connections, state or approval</text>
</svg>
