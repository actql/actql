version: actql/0.1
id: client-parameter-values
params:
  n:
    type: number
stages:
  - id: source
    inputs: {}
    steps:
      - values:
          schema:
            id:
              type: number
              nullable: false
          rows:
            - id: 1
        as: seed
      - derive:
          value: id + $n
        as: selected
    results:
      rows:
        from: selected
        fields:
          - id
          - value
results:
  answer:
    from:
      stage: source
      result: rows
