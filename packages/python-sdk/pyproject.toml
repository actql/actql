[build-system]
requires = ["setuptools>=68,<81", "wheel>=0.44,<0.46"]
build-backend = "setuptools.build_meta"

[project]
name = "actql-sdk"
version = "0.0.0.dev0"
description = "Lightweight Python Client for an existing ActQL HTTPS Host"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "rfc8785==0.1.4"]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
local = ["actql-local-runtime==0.0.0.dev0", "wasmtime==38.0.0"]
dev = ["build==1.3.0", "setuptools==80.10.2", "wheel==0.45.1", "mypy==1.19.1"]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
python_version = "3.11"
strict = true
follow_imports = "silent"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
actql_sdk = ["_contract.json", "py.typed"]
