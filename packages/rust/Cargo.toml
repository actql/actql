[package]
name = "actql"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "ActQL embedded Host and generated Core Wasm binding"
publish = false

[dependencies]
anyhow = "=1.0.104"
sha2 = "=0.10.9"
wasmtime = { version = "=38.0.0", default-features = false, features = ["std", "runtime", "cranelift"] }

[dev-dependencies]
wat = "=1.239.0"

[profile.dev]
debug = 0
incremental = false

[workspace]
resolver = "3"
members = ["tools/source-inventory"]
default-members = ["."]
