# Records which tracked files the Linux Wasm and Native Core steps open and
# fails when scripts/ci-core-inputs.json does not cover one of them. Pull
# request target selection relies on that list being complete.
name: Core inputs

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - scripts/ci-core-inputs.mjs
      - scripts/ci-core-inputs.json
      - .github/workflows/core-inputs.yml
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' }}
    name: record (${{ matrix.target }} ${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: wasm, partition: 1/4, id: wasm}
          - {target: native, partition: linux-common-1/8, id: native-1}
          - {target: native, partition: linux-common-2/8, id: native-2}
          - {target: native, partition: linux-common-3/8, id: native-3}
          - {target: native, partition: linux-common-4/8, id: native-4}
          - {target: native, partition: linux-common-5/8, id: native-5}
          - {target: native, partition: linux-common-6/8, id: native-6}
          - {target: native, partition: linux-common-7/8, id: native-7}
          - {target: native, partition: linux-common-8/8, id: native-8}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      - name: Install strace
        run: |
          sudo apt-get update
          sudo apt-get install --yes strace
      - name: Record the files opened by the Core steps
        run: node scripts/ci-core-inputs.mjs record "${{ matrix.target }}" "${{ matrix.partition }}" "$RUNNER_TEMP/core-inputs/${{ matrix.id }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: core-inputs-${{ matrix.id }}
          path: ${{ runner.temp }}/core-inputs/
          if-no-files-found: error
          retention-days: 14

  verify:
    needs: [record]
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: core-inputs-*
          path: ${{ runner.temp }}/core-inputs
      - name: Require the recorded list to cover every file the Core steps opened
        run: node scripts/ci-core-inputs.mjs verify "$RUNNER_TEMP/core-inputs"
