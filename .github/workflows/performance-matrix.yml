# TEMPORARY DIAGNOSTIC BRANCH ONLY. Never merge this workflow replacement.
name: Linux Crypto partial diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crypto-partial:
    name: One original Linux Crypto partial under gdb
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.16'
      - name: Install existing pinned clang19 and debugger tooling
        timeout-minutes: 5
        run: |
          bash scripts/ci-install-linux-clang.sh
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install --yes --no-install-recommends gdb
      - name: Install pinned provider tooling without ActQL runtime preparation
        timeout-minutes: 4
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
      - name: Observe only the original 4096-byte partial once
        timeout-minutes: 4
        run: |
          python3 scripts/diagnose-native-crypto-partial.py \
            --source "$GITHUB_SHA" --clang "$(realpath /usr/bin/clang-19)" \
            --gdb "$(realpath /usr/bin/gdb)" --moon-home "$MOON_HOME" \
            --output "$RUNNER_TEMP/crypto-partial-diagnostic" --seconds 180
      - name: Preserve bounded sanitized observations and exact input receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crypto-partial-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/crypto-partial-diagnostic/summary.json
            ${{ runner.temp }}/crypto-partial-diagnostic/inputs.json
            ${{ runner.temp }}/crypto-partial-diagnostic/allocator-conformance
          if-no-files-found: error
          retention-days: 7
