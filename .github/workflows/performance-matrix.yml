name: Temporary packed harness Linux abort diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packed-harness-linux:
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
      - name: Stage the temporary collector before selecting original Source
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/packed-harness-abort"
          cp scripts/diagnose-packed-harness-abort.mjs scripts/diagnose-packed-harness-abort.gdb.py "$RUNNER_TEMP/packed-harness-abort/"
      - name: Select the exact failed-command Source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 217d8fa9b31345780bfd3f0fd99d77618a92d6fe
          persist-credentials: false
      - name: Install only the existing command dependencies
        shell: bash
        run: |
          npm ci
          npm ci --prefix adapters/connectors/duckdb/node --ignore-scripts
      - name: Prepare the native debugger without a runtime build
        shell: bash
        run: |
          if ! command -v gdb; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends gdb
          fi
          gdb --version
      - name: Run original eight-file command once with a 60 second bound
        shell: bash
        run: |
          ulimit -c 0
          node "$RUNNER_TEMP/packed-harness-abort/diagnose-packed-harness-abort.mjs" "$GITHUB_WORKSPACE" "$RUNNER_TEMP/packed-harness-abort"
      - name: Preserve only command output, native stacks and source identities
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packed-harness-abort-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/packed-harness-abort/result.json
            ${{ runner.temp }}/packed-harness-abort/source.json
            ${{ runner.temp }}/packed-harness-abort/command.stdout.log
            ${{ runner.temp }}/packed-harness-abort/command.stderr.log
            ${{ runner.temp }}/packed-harness-abort/native-events.json
            ${{ runner.temp }}/packed-harness-abort/native-backtrace.log
          if-no-files-found: error
          retention-days: 7
