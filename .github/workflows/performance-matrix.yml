# TEMPORARY DIAGNOSTIC REF ONLY. Never merge into an integration branch.
name: Original Linux Crypto close observation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  original-close:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install debugger only
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb
      - name: Inspect original partial close from exact retained ELF
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/replay-native-crypto-close.py
      - name: Preserve original observations
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crypto-close-replay-${{ github.sha }}
          path: |
            ${{ runner.temp }}/crypto-close-replay/summary.json
            ${{ runner.temp }}/crypto-close-replay/gdb.stdout
            ${{ runner.temp }}/crypto-close-replay/gdb.stderr
            ${{ runner.temp }}/crypto-close-replay/original-inputs.json
          if-no-files-found: error
          retention-days: 7
