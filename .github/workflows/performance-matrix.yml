# Temporary diagnostic-branch replacement of an already registered workflow.
# Never merge this workflow or its helper into a product branch.
name: Faithful source two-member first-close diagnostic
on:
  workflow_dispatch:
    inputs:
      effect-first-close-diagnostic:
        description: Diagnose the independent Source/Effects first-close case with current-source JS
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
jobs:
  effect-first-close:
    if: ${{ inputs.effect-first-close-diagnostic && github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
      - name: Install pinned source builder tools without lifecycle builds
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install only the tracked prebuilt DuckDB peer
        run: npm ci --prefix adapters/connectors/duckdb/node --ignore-scripts --no-audit --no-fund
      - name: Prepare the exact pinned MoonBit compiler and Core
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$PWD/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Fetch only the retained Linux FS binding artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/effect-first-close"
          gh api repos/actql/actql/actions/artifacts/14027925417 > "$RUNNER_TEMP/effect-first-close/artifact-metadata.json"
          gh api repos/actql/actql/actions/artifacts/14027925417/zip > "$RUNNER_TEMP/effect-first-close/artifact.zip"
      - name: Compile six current-source JS entrances and run only the failed first-close case
        env:
          TMPDIR: ${{ github.workspace }}/_build
        run: node scripts/diagnose-effect-first-close.mjs "$RUNNER_TEMP/effect-first-close"
      - name: Retain only source, artifact and closed-count diagnostic reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: effect-first-close-diagnostic-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/effect-first-close/artifact-metadata.json
            ${{ runner.temp }}/effect-first-close/prepared-inputs.json
            ${{ runner.temp }}/effect-first-close/source-correspondence.json
            ${{ runner.temp }}/effect-first-close/diagnostic-result.json
