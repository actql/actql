# Temporary replacement of an already registered workflow; never merge.
# Run the original normal producer and distribution consumer at the same SHA.
name: Exact normal distribution first-close diagnostic
on:
  workflow_dispatch:
    inputs:
      exact-distribution-context:
        description: Run the unchanged normal package and distribution jobs
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  client-packages:
    if: ${{ inputs.exact-distribution-context && github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.packages.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      - name: Pack the Client packages once for these jobs
        run: node scripts/packed-client-packages.mjs "$RUNNER_TEMP/actql-client-packages"
      - name: Retain immutable Client package inputs
        id: packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actql-client-packages-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/actql-client-packages/packed-client-packages.json
            ${{ runner.temp }}/actql-client-packages/actql-client-wire-0.0.0-development.tgz
            ${{ runner.temp }}/actql-client-packages/actql-sdk-0.0.0-development.tgz
            ${{ runner.temp }}/actql-client-packages/actql-run-host-core-0.0.0-development.tgz
            ${{ runner.temp }}/actql-client-packages/actql-local-node-0.0.0-development.tgz
            ${{ runner.temp }}/actql-client-packages/actql-node-0.0.0-development.tgz
          if-no-files-found: error
          retention-days: 7

  client-distribution:
    if: ${{ inputs.exact-distribution-context && github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' }}
    needs: [client-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # The unchanged compatibility consumer reads public pre-extension SDKs.
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      - name: Download the exact Client package artifact
        id: client-inputs
        uses: ./.github/actions/download-client-packages
        with:
          artifact-id: ${{ needs.client-packages.outputs.artifact-id }}
          path: ${{ runner.temp }}/actql-client-packages
      - name: Install pinned AI SDK provider test dependencies
        run: npm ci --prefix packages/provider-ai-sdk --ignore-scripts
      # Separate existing commands so ci-evidence/ci-timing can measure each
      # preparation stage. The final default-success step remains the barrier.
      - name: Build source-backed distribution runtime
        id: distribution-runtime
        env:
          TMPDIR: ${{ github.workspace }}/_build
        run: node scripts/build-runtime-packages.mjs local-node run-host-core
      - name: Build source-backed distribution adapters
        id: distribution-adapters
        env:
          TMPDIR: ${{ github.workspace }}/_build
        run: node scripts/build-local-node-adapters.mjs
      - name: Check publication wire freshness
        id: distribution-publication-wire-check
        env:
          TMPDIR: ${{ github.workspace }}/_build
        run: node scripts/generate-client-publication-wire.mjs
      - name: Check Host wire freshness
        id: distribution-preparation
        env:
          TMPDIR: ${{ github.workspace }}/_build
        run: node scripts/generate-client-host-wire.mjs
      - name: Test source-backed distribution contracts
        if: ${{ !cancelled() && steps.distribution-preparation.outcome == 'success' }}
        env:
          TMPDIR: ${{ github.workspace }}/_build
        run: node --test adapters/host-common/file-media-type-consumers.test.mjs adapters/host-node/installed-family-content.test.mjs scripts/packed-public-query-profile.test.mjs scripts/node-local-compile-cache.test.mjs scripts/node-local-owner-selection.test.mjs scripts/node-initial-control-open-routing.test.mjs adapters/host-node/initial-control-package-custody.test.mjs adapters/host-node/initial-control-image-source.test.mjs adapters/host-node/client-full-join-refusal.test.mjs adapters/host-node/local-analytic-preparation.test.mjs adapters/host-node/local-analytic-public.test.mjs adapters/host-node/installed-composed-infer-run.test.mjs adapters/host-common/strategy-usage.test.mjs adapters/host-node/ledger-usage-consumers.test.mjs adapters/host-node/composed-infer-provider.test.mjs adapters/host-node/infer-evaluation-evidence.test.mjs examples/infer-evaluation/capture-sink.test.mjs scripts/typed-json-literal-preparation.test.mjs scripts/typed-json-literal-public.test.mjs scripts/packed-client-packages.test.mjs scripts/packed-graph-host-dependencies.test.mjs scripts/packed-package-boundaries.test.mjs scripts/graph-composition-fixture.test.mjs scripts/packed-salesforce-model-materials.test.mjs scripts/dbt-compat-judge.test.mjs scripts/sga-surface-checker.test.mjs scripts/infer-owner-checker.test.mjs scripts/graph-surface-checker.test.mjs scripts/graph-public-host.test.mjs scripts/generate-client-publication-wire.test.mjs scripts/generate-client-host-wire.test.mjs packages/client-wire/index.test.mjs packages/client-wire/submission-check-observations.test.mjs packages/sdk/structured-program-check-observations.test.mjs packages/sdk/scoped-authoring-check.test.mjs packages/sdk/index.test.mjs packages/sdk/cancel-identity.test.mjs packages/sdk/read-progress.test.mjs packages/sdk/host-port.test.mjs packages/sdk/result-description.test.mjs packages/sdk/http-redirect.test.mjs packages/sdk/checkpoints.test.mjs packages/sdk/model-checkpoints.test.mjs adapters/host-node/instal