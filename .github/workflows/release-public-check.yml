name: Published release check

# Run only after the original candidate bytes are actually published. This
# workflow reads GitHub/npm and consumes those bytes; it never builds or writes
# a registry, tag, release or package artifact.
on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact source H of the successful release candidate
        type: string
        required: true
      candidate_run_id:
        description: Original release-candidate workflow run ID
        type: string
        required: true
      candidate_run_attempt:
        description: Original successful candidate run attempt
        type: string
        required: true
      node_artifact_id:
        description: Original fixed four-package Node RC artifact ID
        type: string
        required: true
      native_artifact_id:
        description: Original joint launcher and two-platform Native RC artifact ID
        type: string
        required: true
      node_manifest_sha256:
        description: Externally retained original Node release.json SHA256
        type: string
        required: true
      native_manifest_sha256:
        description: Externally retained original Native release.json SHA256
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: release-public-check-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      run-id: ${{ steps.verify.outputs.run-id }}
      run-attempt: ${{ steps.verify.outputs.run-attempt }}
      node-artifact-id: ${{ steps.verify.outputs.node-artifact-id }}
      native-artifact-id: ${{ steps.verify.outputs.native-artifact-id }}
      node-manifest-sha256: ${{ steps.verify.outputs.node-manifest-sha256 }}
      native-manifest-sha256: ${{ steps.verify.outputs.native-manifest-sha256 }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
      - name: Authenticate the original successful candidate and observe public latest tags
        id: verify
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          NODE_ARTIFACT_ID: ${{ inputs.node_artifact_id }}
          NATIVE_ARTIFACT_ID: ${{ inputs.native_artifact_id }}
          NODE_MANIFEST_SHA256: ${{ inputs.node_manifest_sha256 }}
          NATIVE_MANIFEST_SHA256: ${{ inputs.native_manifest_sha256 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {writeFileSync, appendFileSync} from 'node:fs';
          import {join} from 'node:path';
          const env = process.env, sha = env.CANDIDATE_SHA, runId = env.CANDIDATE_RUN_ID, attempt = env.CANDIDATE_RUN_ATTEMPT;
          assert.match(sha, /^[a-f0-9]{40}$/u);
          for (const value of [runId, attempt, env.NODE_ARTIFACT_ID, env.NATIVE_ARTIFACT_ID]) {
            assert.match(value, /^[1-9][0-9]*$/u); assert(Number.isSafeInteger(Number(value)));
          }
          for (const value of [env.NODE_MANIFEST_SHA256, env.NATIVE_MANIFEST_SHA256]) assert.match(value, /^[a-f0-9]{64}$/u);
          assert.notEqual(env.NODE_ARTIFACT_ID, env.NATIVE_ARTIFACT_ID);
          const base = `https://api.github.com/repos/${env.GITHUB_REPOSITORY}`;
          async function github(path) {
            const response = await fetch(base + path, {headers: {accept: 'application/vnd.github+json',
              authorization: `Bearer ${env.GH_TOKEN}`, 'X-GitHub-Api-Version': '2022-11-28'}, signal: AbortSignal.timeout(30000)});
            assert.equal(response.status, 200, `Candidate metadata unavailable: ${path}`);
            return response.json();
          }
          const run = await github(`/actions/runs/${runId}/attempts/${attempt}`);
          assert.equal(String(run.id), runId); assert.equal(String(run.run_attempt), attempt);
          assert.equal(run.status, 'completed'); assert.equal(run.conclusion, 'success');
          assert.equal(run.head_sha, sha); assert.equal(run.repository.full_name, env.GITHUB_REPOSITORY);
          assert.equal(run.head_repository.full_name, env.GITHUB_REPOSITORY);
          assert.equal(run.path.split('@')[0], '.github/workflows/release-candidate.yml');
          assert(['pull_request', 'workflow_dispatch'].includes(run.event));
          const artifacts = [];
          for (const [kind, id, name] of [
            ['node', env.NODE_ARTIFACT_ID, `node-release-rc-${sha}-${runId}-${attempt}`],
            ['native', env.NATIVE_ARTIFACT_ID, `native-public-0.0.2-${sha}-${runId}-${attempt}`]]) {
            const artifact = await github(`/actions/artifacts/${id}`);
            assert.equal(String(artifact.id), id); assert.equal(artifact.name, name);
            assert.equal(String(artifact.workflow_run.id), runId); assert.equal(artifact.workflow_run.head_sha, sha);
            assert.equal(artifact.expired, false); assert(Number.isSafeInteger(artifact.size_in_bytes) && artifact.size_in_bytes > 0);
            assert.match(artifact.digest, /^sha256:[a-f0-9]{64}$/u);
            artifacts.push({kind, artifact});
          }
          const latest = [];
          for (const name of ['@actql/client-wire', '@actql/sdk', '@actql/local-node', '@actql/node',
            'actql', '@actql/cli-linux-x64-gnu', '@actql/cli-darwin-arm64']) {
            const url = `https://registry.npmjs.org/-/package/${encodeURIComponent(name)}/dist-tags`;
            const response = await fetch(url, {headers: {accept: 'application/json'}, signal: AbortSignal.timeout(30000)});
            assert.equal(response.status, 200, `Public tags unavailable: ${name}`);
            const tags = await response.json(); latest.push({name, url, tags});
            assert.equal(tags.latest, '0.0.2', `Wrong public latest: ${name}`);
          }
          writeFileSync(join(env.RUNNER_TEMP, 'public-inputs.json'), JSON.stringify({observedAt: new Date().toISOString(),
            sourceSha: sha, candidateRun: run, artifacts, latest, manifestSha256: {
              node: env.NODE_MANIFEST_SHA256, native: env.NATIVE_MANIFEST_SHA256}}, null, 2) + '\n', {flag: 'wx'});
          for (const [name, value] of [['sha', sha], ['run-id', runId], ['run-attempt', attempt],
            ['node-artifact-id', env.NODE_ARTIFACT_ID], ['native-artifact-id', env.NATIVE_ARTIFACT_ID],
            ['node-manifest-sha256', env.NODE_MANIFEST_SHA256], ['native-manifest-sha256', env.NATIVE_MANIFEST_SHA256]]) {
            appendFileSync(env.GITHUB_OUTPUT, `${name}=${value}\n`);
          }
          JS
      - name: Retain the original-source, artifact and public-tag observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-inputs-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public-inputs.json
          if-no-files-found: warn
          retention-days: 14

  node-public:
    needs: [candidate]
    name: Published Node (${{ matrix.target }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.0', '24']
        target: [linux-x64, darwin-arm64]
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - target: darwin-arm64
            runner: macos-26
            platform: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.candidate.outputs.node-artifact-id }}
          run-id: ${{ needs.candidate.outputs.run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/node-public-input
          merge-multiple: true
      - name: Bind the original Node manifest and actual consumer platform
        env:
          SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
          MANIFEST_SHA256: ${{ needs.candidate.outputs.node-manifest-sha256 }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';import {createHash} from 'node:crypto';
          const bytes = readFileSync(process.env.RUNNER_TEMP + '/node-public-input/node-release-rc/release.json');
          assert.equal(createHash('sha256').update(bytes).digest('hex'), process.env.MANIFEST_SHA256);
          assert.equal(JSON.parse(bytes).sourceSha, process.env.SOURCE_SHA);
          assert.equal(process.platform, process.env.EXPECTED_PLATFORM); assert.equal(process.arch, process.env.EXPECTED_ARCH);
          JS
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Prepare the existing locked cold-restoration dependencies
        run: |
          python -m venv "$RUNNER_TEMP/readme-table-python"
          "$RUNNER_TEMP/readme-table-python/bin/python" -m pip install --require-hashes -r adapters/connectors/local/iceberg/requirements.lock
      - name: Consume only the original exact public Node version and bytes
        env:
          ACTQL_TABLE_PYTHON: ${{ runner.temp }}/readme-table-python/bin/python
          MANIFEST_SHA256: ${{ needs.candidate.outputs.node-manifest-sha256 }}
        run: |
          node scripts/test-package-release-readme.mjs "$RUNNER_TEMP/node-public-input/node-release-rc" \
            "$RUNNER_TEMP/node-public-receipt.json" --public-registry "$MANIFEST_SHA256"
      - name: Retain actual public Node outcomes and original fixture observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-node-${{ needs.candidate.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/node-public-receipt.json
            ${{ runner.temp }}/actql-release-readme-*/raw/*
            ${{ runner.temp }}/actql-release-readme-*/**/*.observation.json
            ${{ runner.temp }}/actql-release-readme-*/**/*.pending.json
            ${{ runner.temp }}/actql-release-readme-*/**/*.before-close.json
            ${{ runner.temp }}/actql-release-readme-*/**/*.progress.json
          if-no-files-found: warn
          retention-days: 14

  native-public:
    needs: [candidate]
    name: Published Native (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: ubuntu-24.04
            platform: linux
            arch: x64
          - target: darwin-arm64
            runner: macos-26
            platform: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.candidate.outputs.native-artifact-id }}
          run-id: ${{ needs.candidate.outputs.run-id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/native-public-input
          merge-multiple: true
      - name: Bind the original Native manifest and actual consumer platform
        env:
          SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
          MANIFEST_SHA256: ${{ needs.candidate.outputs.native-manifest-sha256 }}
          EXPECTED_PLATFORM: ${{ matrix.platform }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          printf 'TMPDIR=%s\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';import {readFileSync} from 'node:fs';import {createHash} from 'node:crypto';
          const bytes = readFileSync(process.env.RUNNER_TEMP + '/native-public-input/release.json');
          assert.equal(createHash('sha256').update(bytes).digest('hex'), process.env.MANIFEST_SHA256);
          assert.equal(JSON.parse(bytes).sourceSha, process.env.SOURCE_SHA);
          assert.equal(process.platform, process.env.EXPECTED_PLATFORM); assert.equal(process.arch, process.env.EXPECTED_ARCH);
          JS
      - name: Consume the published launcher and selected original OS payload
        env:
          MANIFEST_SHA256: ${{ needs.candidate.outputs.native-manifest-sha256 }}
        run: |
          node scripts/test-native-cli-public-install.mjs "$RUNNER_TEMP/native-public-input" \
            "$MANIFEST_SHA256" "$RUNNER_TEMP/native-public-receipt.json"
      - name: Retain actual public Native outcomes and safe raw commands
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: public-native-${{ needs.candidate.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/native-public-receipt.json
            ${{ runner.temp }}/actql-public-cli-*/commands.json
            ${{ runner.temp }}/actql-public-cli-*/command-*.stderr
          if-no-files-found: warn
          retention-days: 14

  pubcheck:
    needs: [candidate, node-public, native-public]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the authenticated cohort and every public consumer
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          failed = {name: value['result'] for name, value in json.loads(os.environ['RESULTS']).items()
                    if value['result'] != 'success'}
          if failed:
              raise SystemExit(f'Published release checks failed: {failed}')
          PY
