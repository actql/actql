name: ActQL Health

on:
  workflow_call:
    inputs:
      package-result:
        type: string
        required: true
      package-run-id:
        type: string
        required: true
      package-artifact-id:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      package-run-id:
        description: Completed same-SHA normal client-packages run
        type: string
        required: true
      package-artifact-id:
        description: Exact normal client package artifact ID
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  quick:
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      - name: Fast monitor tests without Runtime build
        run: node scripts/local-checks.mjs test node -- scripts/health-monitor.test.mjs
      - name: Validate dispatch producer provenance
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_RUN_ID: ${{ inputs.package-run-id }}
          PACKAGE_ARTIFACT_ID: ${{ inputs.package-artifact-id }}
        run: node scripts/ordinary-operation-packages.mjs inspect-producer
      - name: Reuse original same-SHA normal artifacts
        if: ${{ inputs.package-result == 'success' || github.event_name == 'workflow_dispatch' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package-run-id }}
          artifact-ids: ${{ inputs.package-artifact-id }}
          path: ${{ runner.temp }}/health-packages
          merge-multiple: true
      - name: Same Quick command; failed or missing producer never becomes a pass
        if: ${{ always() }}
        env:
          PACKAGE_RESULT: ${{ inputs.package-result }}
          RETAINED: ${{ runner.temp }}/health-packages
        run: |
          if [ "$PACKAGE_RESULT" = skipped ] && [ "${{ github.event_name }}" != workflow_dispatch ]; then
            npm run health:quick
          else
            npm run health:quick -- --packages "$RETAINED"
          fi
      - name: Publish monitor Job Summary
        if: ${{ always() }}
        run: find _build/health -name summary.md -type f -exec cat {} \; >> "$GITHUB_STEP_SUMMARY"
      - name: Retain original reports and raw failures
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: health-quick-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            _build/health/
            _build/local-checks/attempts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
