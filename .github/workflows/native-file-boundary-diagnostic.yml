name: One retained Native File boundary diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  file-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: diagnostic
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
      - name: Check out the original artifact Source without a product overlay
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: bda5c942c20472d34ff512477941106370e98298
          path: original
          persist-credentials: false
      - name: Install original verifier tools only
        working-directory: original
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fetch and verify the exact retained failed-producer artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-file-boundary/release"
          gh api repos/actql/actql/actions/artifacts/14028196384 > "$RUNNER_TEMP/native-file-boundary/artifact-metadata.json"
          gh api repos/actql/actql/actions/artifacts/14028196384/zip > "$RUNNER_TEMP/native-file-boundary/artifact.zip"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'native-file-boundary'
          metadata = json.loads((root / 'artifact-metadata.json').read_text())
          assert metadata['id'] == 14028196384 and not metadata['expired']
          assert metadata['workflow_run']['id'] == 43405189585
          body = (root / 'artifact.zip').read_bytes()
          assert len(body) == 15880275
          assert hashlib.sha256(body).hexdigest() == '0f8d9acaa0d57bfc8a1c102c04aa5001b8ffe1cd7f8204869dd8f3e019d8bb07'
          with zipfile.ZipFile(root / 'artifact.zip') as archive:
              for name in ['release.json', 'actql-0.0.2-rc.0.tgz', 'actql-cli-linux-x64-gnu-0.0.2-rc.0.tgz']:
                  (root / 'release' / name).write_bytes(archive.read('release/' + name))
          PY
      - name: Check and run only the corrected File input, then cold same Saved
        env:
          ACTQL_DIAGNOSTIC_SOURCE: ${{ github.sha }}
        run: |
          node diagnostic/scripts/diagnose-retained-native-file-boundary.mjs \
            "$GITHUB_WORKSPACE/original" \
            "$RUNNER_TEMP/native-file-boundary/release" \
            "$GITHUB_WORKSPACE/diagnostic/scripts/fixtures/native-file-task-boundary.json" \
            "$RUNNER_TEMP/native-file-boundary/evidence"
      - name: Retain diagnostic outcome and commands, excluding all business state
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-file-boundary-diagnostic-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/native-file-boundary/artifact-metadata.json
            ${{ runner.temp }}/native-file-boundary/evidence/*.json
            ${{ runner.temp }}/native-file-boundary/evidence/*.log
