    steps:
      - name: Require all four producers and mandatory validation before transfer
        env:
          PIPELINE_NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const assert = require("node:assert/strict");
            const jobs = JSON.parse(process.env.PIPELINE_NEEDS);
            const names = ["pipeline-capacity", "pipeline-capacity-mutants", "pipeline-mutations", "pipeline-mutations-rest"];
            assert.deepEqual(Object.keys(jobs).sort(), [...names, "pipeline-validation"].sort());
            assert.equal(jobs["pipeline-validation"].result, "success", "Required synthetic validation did not succeed");
            const ids = [];
            for (const name of names) {
              const job = jobs[name];
              assert.equal(job.result, "success", `${name} failed, cancelled or skipped`);
              assert.match(job.outputs["artifact-id"] ?? "", /^[1-9][0-9]*$/);
              for (const key of ["artifact-digest", "archive-digest", "manifest-digest"])
                assert.match(job.outputs[key] ?? "", /^[0-9a-f]{64}$/);
              ids.push(job.outputs["artifact-id"]);
            }
            assert.equal(new Set(ids).size, 4, "Part artifacts must be distinct");
          '
