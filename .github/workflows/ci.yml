name: CI

# Runs automatically for main, integration branches headed for main and
# pull requests. A working branch is checked on demand:
#   gh workflow run CI --ref <branch> [-f native_macos=true]
on:
  push:
    branches:
      - main
      - 'integration/**'
  pull_request:
  workflow_dispatch:
    inputs:
      performance_matrix:
        description: Run the registered performance matrix at this revision
        type: boolean
        default: false
      native_macos:
        description: Also run the macOS native job (billed at ten times Linux)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.performance_matrix && 'performance' || 'normal' }}
  cancel-in-progress: ${{ !inputs.performance_matrix }}

jobs:
  performance-matrix:
    if: github.event_name == 'workflow_dispatch' && inputs.performance_matrix
    uses: ./.github/workflows/performance-matrix.yml
  # Quick checks that need no full test build: they report version, format,
  # interface and environment problems within minutes.
  lint:
    if: ${{ !inputs.performance_matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      - name: Check owned contract versions
        run: npm run check:contract-versions
      - run: moon fmt --check
      - name: Check public interfaces
        run: node scripts/check-moonbit-api.mjs
      - name: Test environment guards
        run: node --test scripts/moonbit-environment.test.mjs
      - name: Test portable dependency inspection and injected violations
        run: node --test scripts/portable-core.test.mjs
      - name: Execute standard module subsets without DuckDB dependencies
        run: node scripts/check-node-without-duckdb.mjs
  # One runner per target: check, then test, each with --deny-warn, as
  # before. A target never shares a runner or _build with another.
  core:
    if: ${{ !inputs.performance_matrix }}
    name: core (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [js, wasm, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      - name: Check common core
        run: moon check --target "${{ matrix.target }}" --deny-warn
      # Measured on these 2-vCPU runners: the default left native test
      # execution on about one CPU; one job per CPU shortened execution on
      # every target with no change in memory. Building is unaffected.
      - name: Test common core
        run: moon test --target "${{ matrix.target }}" --deny-warn -j "$(getconf _NPROCESSORS_ONLN)"
  # Host, authorization, Checkpoint and retained-state owners.
  host:
    if: ${{ !inputs.performance_matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      - name: Test bounded retained storage and process lifecycle
        run: npm run check:retained-boundary
      - name: Test portable publication control with the durable Store
        run: npm run check:publication-runtime
      - name: Test retained experiment fixtures and timing assessment
        run: node --test benchmarks/retained-results/*.test.mjs
      - name: Test control-side process admission without DuckDB
        run: npm run check:process-capacity
      - name: Test durable Remote Site dispatch admission
        run: npm run check:remote-site-runtime
      - name: Test durable Checkpoint journal and resumed dispatch admission
        run: npm run check:checkpoint-runtime
      - name: Test native retained task file ownership
        run: npm run check:native-retained-task-file
      - name: Test portable Remote Transfer owner package
        run: npm run check:transfer-core
      - name: Test portable Run Host compilation package
        run: npm run check:run-host-core
      - name: Test packed Local runtime assets
        run: npm run check:local-node-assets
  # Public Client, packed distribution and the Salesforce Site.
  client:
    if: ${{ !inputs.performance_matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      - name: Test distribution Client wire, Host and packed Node assembly
        env:
          TMPDIR: ${{ github.workspace }}/_build
        run: npm run check:distribution-client
      - name: Test Salesforce Site Catalog and bounded query acquisition
        run: npm run check:salesforce-site
  # Native storage, publication and control, and the Native retained path.
  native:
    if: ${{ !inputs.performance_matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      - name: Test Node-free native storage publication and control
        env:
          ACTQL_TEST_SCRATCH_ROOT: ${{ github.workspace }}/.native-tests
        run: npm run check:native-http-client
      - name: Verify registered Native retained product path
        run: |
          moon build --target js --release
          moon build src/cmd/native_retained_case_probe --target native --release
          node benchmarks/retained-results/native-case-probe.mjs native-acquisition-full-validation-low-selectivity/narrow/100
          node benchmarks/retained-results/native-case-probe.mjs fixed-join-count-shrinking-intermediate/narrow/1000
          node benchmarks/retained-results/native-estimate-calibration.mjs \
            native-acquisition-full-validation-low-selectivity/narrow/1000 \
            native-acquisition-full-validation-low-selectivity/narrow/100 \
            "$RUNNER_TEMP/native-retained-calibration.json"
          ACTQL_NATIVE_CALIBRATION_PROFILE="$RUNNER_TEMP/native-retained-calibration.json" \
            node scripts/test-native-direct-pair.mjs
  # The single result: every required job succeeded. A failure, a
  # cancellation or an unexpected skip fails it; it runs even when a
  # dependency failed. The macOS job may be skipped only where it is not
  # scheduled (see its condition).
  check:
    if: ${{ always() && !inputs.performance_matrix }}
    needs: [lint, core, host, client, native, documents, native-macos,
      native-separated-network, workers, connector-addition, duckdb-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ toJSON(needs) }}
          MACOS_SCHEDULED: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
              (github.event_name == 'pull_request' && github.base_ref == 'main') ||
              (github.event_name == 'workflow_dispatch' && inputs.native_macos) }}
        run: |
          node -e '
            const results = JSON.parse(process.env.RESULTS);
            const macos = process.env.MACOS_SCHEDULED.trim() === "true";
            let failed = false;
            for (const [job, {result}] of Object.entries(results)) {
              const ok = result === "success" ||
                (job === "native-macos" && !macos && result === "skipped");
              console.log(`${ok ? "ok  " : "FAIL"} ${job}: ${result}`);
              if (!ok) failed = true;
            }
            if (failed) process.exit(1);
          '
  documents:
    if: ${{ !inputs.performance_matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install pinned MoonBit
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - run: npm run check:docs
  # macOS minutes cost ten times Linux ones: run for main, pull requests to
  # main, and on demand.
  native-macos:
    if: >-
      ${{ !inputs.performance_matrix && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.base_ref == 'main') ||
        (github.event_name == 'workflow_dispatch' && inputs.native_macos)) }}
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            adapters/connectors/duckdb/node/package-lock.json
      - run: npm ci
      - name: Install pinned native DuckDB transport
        run: npm ci --prefix adapters/connectors/duckdb/node --ignore-scripts
      - name: Install pinned MoonBit
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Verify native macOS arm64 profile
        run: |
          test "$(uname -m)" = arm64
          moon version --all
          npm run check:native-retained-task-file
          ACTQL_TEST_SCRATCH_ROOT="$RUNNER_TEMP/actql-native" \
            npm run check:native-http-client
  native-separated-network:
    if: ${{ !inputs.performance_matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            adapters/connectors/duckdb/node/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install pinned native DuckDB transport
        run: npm ci --prefix adapters/connectors/duckdb/node --ignore-scripts
      - name: Install pinned MoonBit
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Install isolated network tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 iptables curl
      - name: Verify native direct and outbound-only Store profiles
        env:
          ACTQL_TEST_SCRATCH_ROOT: ${{ runner.temp }}/actql-native-network
        run: npm run check:native-separated-network
  workers:
    if: ${{ !inputs.performance_matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: adapters/workers/package-lock.json
      - run: npm ci --prefix adapters/workers --ignore-scripts
      - name: Install pinned MoonBit
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Record verification revision and runtime versions
        run: |
          git rev-parse HEAD
          uname -a
          node --version
          moon version --all
          npm ls --prefix adapters/workers
      - name: Check generated Workers fixtures
        run: node scripts/workers-fixtures.mjs
      - name: Check isolated Core closure in all targets
        run: node scripts/check-core-without-connectors.mjs
      - name: Build inspect and execute the Workers JS profile
        run: npm test --prefix adapters/workers
  connector-addition:
    if: ${{ !inputs.performance_matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: adapters/connectors/duckdb/node/package-lock.json
      - run: npm ci --prefix adapters/connectors/duckdb/node --ignore-scripts
      - name: Install pinned MoonBit
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Record fixed source and tools
        run: |
          git rev-parse HEAD
          uname -a
          node --version
          moon version --all
          npm ls --prefix adapters/connectors/duckdb/node
      - name: Verify independent Connector addition without common changes
        env:
          ACTQL_CONNECTOR_ADDITION_ARTIFACTS: _build/connector-addition-artifacts
        run: npm run check:connector-addition
      - name: Preserve dependency digests and execution logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: connector-addition-${{ github.sha }}
          path: _build/connector-addition-artifacts
          if-no-files-found: warn
          retention-days: 14
  duckdb-node:
    if: ${{ !inputs.performance_matrix }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: adapters/connectors/duckdb/node/package-lock.json
      - name: Install exact DuckDB transport dependencies
        run: npm ci --prefix adapters/connectors/duckdb/node --ignore-scripts
      - name: Install pinned MoonBit for generated SQL conformance
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Record Linux verification revision and environment
        run: |
          git rev-parse HEAD
          uname -a
          node --version
          moon version --all
          npm ls --prefix adapters/connectors/duckdb/node @duckdb/node-api
      - name: Check real DuckDB transport and owned resources
        run: npm test --prefix adapters/connectors/duckdb/node
      - name: Check paired performance provenance
        run: node --test adapters/connectors/duckdb/node/bench/matched-equivalent-pair.test.mjs
      - name: Build fixture-independent acquisition Host entries
        run: npm run build:host --prefix adapters/connectors/duckdb/node
