name: CI

# Read-only PR validation and full main integration. Manual performance and
# evidence probes remain separate modes, never release/deployment actions.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      packed_query_evidence_probe:
        description: Run only the intentionally failing evidence upload probes
        type: boolean
        default: false
      performance_matrix:
        description: Run the registered performance matrix at this revision
        type: boolean
        default: false
      performance_priority_node_mode:
        description: Priority Node samples; final is for a plausible fixed candidate
        type: choice
        options: [diagnostic, final]
        default: diagnostic
      performance_priority_python_mode:
        description: Priority Python samples; final is for a plausible fixed candidate
        type: choice
        options: [diagnostic, final]
        default: diagnostic
      performance_package_run_id:
        description: Completed same-source normal CI run supplying existing Client tarballs
        type: string
        default: ''
      performance_package_artifact_id:
        description: Exact existing Client package artifact for the performance check
        type: string
        default: ''
      performance_native_package_run_id:
        description: Exact normal native package run id
        type: string
        default: ''
      performance_native_package_artifact_id:
        description: Exact normal native package artifact id
        type: string
        default: ''
      performance_python_package_run_id:
        description: Exact normal python package run id
        type: string
        default: ''
      performance_python_package_artifact_id:
        description: Exact normal python package artifact id
        type: string
        default: ''
      performance_process_package_jobs:
        description: JSON object naming the exact native and python normal package jobs
        type: string
        default: '{}'
      native_macos:
        description: Also run the macOS native diagnostic job
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.packed_query_evidence_probe && 'evidence-probe' || inputs.performance_matrix && 'performance' || 'normal' }}
  # Keep the active main integration; GitHub retains only the latest pending run.
  # Branch and performance groups cannot cancel normal main integration.
  cancel-in-progress: ${{ !inputs.performance_matrix && github.ref != 'refs/heads/main' }}

# Public repository validation uses only read permissions. Private/unknown
# visibility stays outside this workflow; no activation variable is required.
jobs:
  select-targets:
    permissions:
      contents: read
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.select.outputs.targets }}
      macos: ${{ steps.select.outputs.macos }}
      profile: ${{ steps.select.outputs.profile }}
      deep_proofs: ${{ steps.select.outputs.deep_proofs }}
      plan: ${{ steps.select.outputs.plan }}
      python_wheels: ${{ steps.select.outputs.python_wheels }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select core targets without weakening evidence campaigns
        id: select
        env:
          NATIVE_MACOS: ${{ inputs.native_macos }}
        run: node scripts/ci-targets.mjs
  packed-query-evidence-probe:
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && (github.event_name == 'workflow_dispatch' && inputs.packed_query_evidence_probe) }}
    uses: ./.github/workflows/packed-query-evidence-probe.yml
  performance-matrix:
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && (github.event_name == 'workflow_dispatch' && inputs.performance_matrix && !inputs.packed_query_evidence_probe) }}
    uses: ./.github/workflows/performance-matrix.yml
    permissions:
      contents: read
      actions: read
    with:
      priority-node-mode: ${{ inputs.performance_priority_node_mode }}
      priority-python-mode: ${{ inputs.performance_priority_python_mode }}
      package-run-id: ${{ inputs.performance_package_run_id }}
      package-artifact-id: ${{ inputs.performance_package_artifact_id }}
      native-package-run-id: ${{ inputs.performance_native_package_run_id }}
      native-package-artifact-id: ${{ inputs.performance_native_package_artifact_id }}
      native-package-producer-job: ${{ fromJSON(inputs.performance_process_package_jobs || '{}').native || '' }}
      python-package-run-id: ${{ inputs.performance_python_package_run_id }}
      python-package-artifact-id: ${{ inputs.performance_python_package_artifact_id }}
      python-package-producer-job: ${{ fromJSON(inputs.performance_process_package_jobs || '{}').python || '' }}
  # Admission checks complete before any normal runtime/proof runner starts.
  preflight:
    needs: [select-targets]
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
      - name: Reject inconsistent operation support and acceptance evidence before fan-out
        run: node --test scripts/pure-operation-inventory.test.mjs
      - name: Check Native diagnostic counter assignments before fan-out
        run: python3 scripts/test_native_timings.py CommandCounterMap
      - run: npm ci
      - name: Test pipeline artifact and aggregate contracts
        run: node --test proofs/relation-pipeline/ci-artifacts.test.mjs
      - name: Check owned contract versions
        run: npm run check:contract-versions
      - name: Check specification metadata without updating it
        run: npm run check:metadata
      - name: Install pinned MoonBit
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - run: moon fmt --check
      - name: Check public interfaces
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node scripts/check-moonbit-api.mjs
      - name: Verify admission checks did not change tracked files
        run: git diff --exit-code
      - name: Admit the fixed main revision or reject superseded working revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-preflight.mjs
  # Remaining independent lint diagnostics run after mandatory admission.
  lint:
    needs: [select-targets, preflight]
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        with:
          python: 'true'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ startsWith(needs.select-targets.outputs.profile, 'draft') }}
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
        if: ${{ startsWith(needs.select-targets.outputs.profile, 'draft') }}
      - name: Type-check public SDK and Client wire declarations
        run: npm run check:client-types
      - name: Test read-only worktree inventory fixtures
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/worktree-inventory.test.mjs
      - name: Test nonzero execution guards
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/test-execution.test.mjs
      - name: Test bounded local execution and optional hook adapters
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/local-checks.test.mjs scripts/local-checks-guard.test.mjs scripts/local-checks-policy.test.mjs scripts/local-checks-hook.test.mjs
      - name: Test environment guards
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/moonbit-environment.test.mjs
      - name: Test native SQLite namespace ownership
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/test-native-core.test.mjs scripts/native-query-coverage.test.mjs scripts/native-resident-phase-watchdog.test.mjs
      - name: Test preflight admission and latest-revision guard
        run: node --test scripts/ci-preflight.test.mjs
      - name: Test focused owning-family selection and zero-test guards
        run: node --test scripts/ci-focused-tests.test.mjs
      - name: Test conservative CI target selection
        run: node --test scripts/ci-targets.test.mjs scripts/ci-main-base.test.mjs
      - name: Test ordinary operation performance assessment
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/operation-performance.test.mjs scripts/benchmark-node-operations.test.mjs scripts/operation-performance-policy.test.mjs scripts/operation-performance-native-control.test.mjs scripts/benchmark-node-process-operations.test.mjs scripts/benchmark-node-sqlite.test.mjs scripts/benchmark-node-boundaries.test.mjs scripts/node-operation-fs-trace.test.mjs scripts/operation-performance-priority-transition.test.mjs scripts/operation-performance-transition-ci.test.mjs
      - name: Test ordinary process collector protocols
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: python3 -I -B scripts/benchmark-ordinary-processes.test.py
      - name: Test ordinary artifact reuse and controlled performance gate
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/ordinary-operation-packages.test.mjs
      - name: Test Client CI partition and aggregate requirements
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/client-ci.test.mjs scripts/native-cli-project-init.test.mjs scripts/native-cli-project-scaffold.test.mjs
      - name: Test explicit release policy and publication refusal
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/release-policy.test.mjs scripts/release-version-schema.test.mjs scripts/release-set.test.mjs scripts/release-review.test.mjs scripts/release-promotion-review.test.mjs scripts/release-registry.test.mjs scripts/release-stage.test.mjs scripts/release-native-registry.test.mjs scripts/release-native-publish.test.mjs scripts/release-native-latest.test.mjs scripts/release-public-install.test.mjs scripts/release-python-install.test.mjs scripts/release-python-publish.test.mjs scripts/release-python-cold-verifier.test.mjs scripts/release-native-install.test.mjs scripts/release-lanes.test.mjs scripts/release-fixed-source.test.mjs scripts/native-standalone-release.test.mjs scripts/native-cli-version.test.mjs
      - name: Test cross-host Python release preparation without runtime loading
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: |
          python3 -m pip install --disable-pip-version-check -e ./packages/python-sdk
          python3 -B packages/python-sdk/tests/run.py --pattern test_release_packaging_target.py
      - name: Test normal Python wheel acceptance harness guards
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: python3 -B scripts/test_ci_python_wheels.py
      - name: Test bounded compiler crash metadata privacy controls
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: python3 -B scripts/test_native_compiler_diagnostics.py
      - name: Test read-only CI evidence reporting
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/ci-evidence.test.mjs
      - name: Test portable dependency inspection and injected violations
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/portable-core.test.mjs
      - name: Test dependency isolation scratch ownership
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/dependency-isolation-scratch.test.mjs
      # Full Client distribution owns this exact test in the same Linux/Node environment.
      - name: Test owned scratch when Client distribution is not selected
        if: ${{ needs.select-targets.outputs.profile != 'full' && !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/owned-scratch.test.mjs
      - name: Execute standard module subsets without DuckDB dependencies
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node scripts/check-node-without-duckdb.mjs
  focused-tests:
    needs: [select-targets, preflight]
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && !inputs.performance_matrix && !inputs.packed_query_evidence_probe && (needs.select-targets.outputs.profile == 'focused-tests' || needs.select-targets.outputs.profile == 'draft-focused') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
      - name: Install pinned MoonBit without unrelated native transport dependencies
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Check package and execute changed tests plus owning JS family
        env:
          CI_PLAN: ${{ needs.select-targets.outputs.plan }}
        run: node scripts/ci-focused-tests.mjs
      - name: Upload focused execution diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: focused-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/focused-evidence
          if-no-files-found: warn
          retention-days: 7
  # One runner per target: check, then test, each with --deny-warn, as
  # before. A target never shares a runner or _build with another.
  core:
    needs: [select-targets, preflight]
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && !inputs.performance_matrix && !inputs.packed_query_evidence_probe && needs.select-targets.outputs.profile == 'full' }}
    name: core (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select-targets.outputs.targets) }}
    # Physical Native fixtures use the existing Darwin arm64 profile.
    runs-on: ${{ matrix.target == 'native' && 'macos-14' || 'ubuntu-24.04' }}
    # Native keeps its full 60-minute child after the separate cold checkpoint
    # producers, with time for original failure diagnostics and cleanup.
    timeout-minutes: ${{ matrix.target == 'native' && 90 || 30 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      - name: Require the supported Core Native platform
        if: ${{ matrix.target == 'native' }}
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
      - name: Check common core
        run: moon check --target "${{ matrix.target }}" --deny-warn
      - name: Check independent fixed Run materials identity
        run: node --test scripts/client-values-run-materials-vector.test.mjs scripts/client-publication-values-identity.test.mjs scripts/client-values-compilation-work.test.mjs scripts/client-source-publication-work.test.mjs
      - name: Mark original Native compiler diagnostic window
        id: native-compiler-diagnostic-start
        if: ${{ matrix.target == 'native' }}
        run: >-
          python3 -B scripts/native-compiler-diagnostics.py --start
          --context .artifacts/native-compiler-diagnostics/context.json
      - name: Test actual Native Reader callbacks and original empty compiler driver
        if: ${{ matrix.target == 'native' }}
        run: >-
          node scripts/local-checks.mjs test node --timeout-seconds 300 --
          --test-name-pattern '^Reader custody callbacks preserve'
          scripts/test-native-core.test.mjs
      # Portable tests use the runner CPU count. Native serializes the large
      # generated C compilations to limit concurrent compiler memory pressure.
      - name: Test common core
        # A diagnostic failure still fails this job, but must not suppress the
        # original Native campaign after its actual prerequisites succeeded.
        if: >-
          ${{ (matrix.target == 'native' && !cancelled() &&
               steps['native-compiler-diagnostic-start'].outcome == 'success') ||
              (matrix.target != 'native' && success()) }}
        env:
          ACTQL_TEST_NATIVE_COMPILER_DIAGNOSTIC: ${{ matrix.target == 'native' && '1' || '' }}
        run: |
          if [ "${{ matrix.target }}" = native ]; then
            # Pinned Linux Native debug codegen exceeds the default 8 MiB
            # compiler stack. This does not change product resource budgets.
            if [ "$(uname -s)" = Linux ]; then
              ulimit -S -s 65536
            fi
            # Reopen remains within a run; the full run below starts fresh.
            node scripts/test-native-core.mjs --deny-warn -p platform_native/trusted_clock
            # Optimize the test IR before emitting the large full-Core C input.
            # Keep every test, strict warnings and the original generated-C
            # backend; production and the focused debug prerequisite are unchanged.
            # Compile two independent C units concurrently, while keeping
            # physical test execution serial under the original fixture roots.
            MOONBIT_NEW_NATIVE=0 node scripts/test-native-core.mjs --deny-warn --release --strip -j 2 --no-parallelize --verbose
          else
            moon test --target "${{ matrix.target }}" --deny-warn -j "$(getconf _NPROCESSORS_ONLN)"
            if [ "${{ matrix.target }}" = wasm ]; then
              # The exported lookup counter retains physical imports. The
              # existing entrance harness refuses every actual Host call.
              moon test --target wasm --release --build-only --deny-warn -j "$(getconf _NPROCESSORS_ONLN)" src/client_host_wasm --filter '*exported validation reaches*'
              node scripts/test-python-local-metadata-wasm.mjs _build/wasm/release/test/client_host_wasm/client_host_wasm.whitebox_test.wasm _build/wasm/release/test/client_host_wasm/__whitebox_test_info.json saved_lookup_validation_dispatch_wbtest.mbt
              node scripts/test-python-local-metadata-wasm.mjs _build/wasm/release/test/client_host_wasm/client_host_wasm.whitebox_test.wasm _build/wasm/release/test/client_host_wasm/__whitebox_test_info.json non_sdk_source_restore_wbtest.mbt
            fi
          fi
      - name: Collect only current original Native compiler crash cause metadata
        if: ${{ failure() && matrix.target == 'native' && steps.native-compiler-diagnostic-start.outcome == 'success' }}
        timeout-minutes: 1
        run: >-
          python3 -B scripts/native-compiler-diagnostics.py
          --context .artifacts/native-compiler-diagnostics/context.json
          --collect .artifacts/native-compiler-diagnostics/sanitized.json
      - name: Retain only sanitized current Native compiler diagnostics
        if: ${{ failure() && matrix.target == 'native' && steps.native-compiler-diagnostic-start.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-compiler-cause-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/native-compiler-diagnostics/
            _build/native-reader-helper-tests/callbacks-*/callback-*.json
          if-no-files-found: warn
          retention-days: 14
  # Conditional proof and correspondence evidence beside the existing gates.
  session-evidence:
    needs: [select-targets, preflight]
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && !inputs.performance_matrix && !inputs.packed_query_evidence_probe && needs.select-targets.outputs.profile == 'full' && needs.select-targets.outputs.deep_proofs == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.session-actions.outputs.artifact-id }}
      artifact-digest: ${{ steps.session-actions.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - name: Install audited Lean pin
        run: |
          node proofs/bounded-session/setup-lean.mjs
          echo "$GITHUB_WORKSPACE/.toolchains/lean-4.30.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Reject invalid evidence derivations
        run: node --test proofs/bounded-session/evidence.test.mjs proofs/bounded-session/proof-check.test.mjs
      - name: Reject invalid incremental action inputs and origins
        run: node --test proofs/ci-evidence/*.test.mjs
      - name: Select fresh or verified-main acquisition for this live run and attempt
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
        run: node proofs/ci-evidence/collect.mjs init
      - name: Produce conditional common-mechanism evidence beside existing gates
        run: node proofs/bounded-session/run.mjs all
      - name: Execute or authenticate the registered JS mutation obligation
        env:
          ACTQL_SESSION_COLLECT: 'true'
        run: node proofs/ci-evidence/collect.mjs mutations
      - name: Reject invalid serial chain derivations and weakened claims
        run: node --test proofs/relation-chain/evidence.test.mjs proofs/relation-chain/proof-check.test.mjs
      - name: Detect serial chain accounting and ownership mutations
        run: node proofs/relation-chain/mutations.mjs
      - name: Reject invalid allocation bounds and weakened capacity propositions
        run: node --test proofs/relation-capacity/model.test.mjs proofs/relation-capacity/evidence.test.mjs proofs/relation-capacity/proof-check.test.mjs
      - name: Check separate registered delayed-stop work regression
        run: node proofs/relation-capacity/repro-delayed-stop.mjs
      - name: Detect allocation reservation and identity mutations on JS
        run: node proofs/relation-capacity/mutations.mjs
      # Keep both evidence sets fresh: either mutation batch can invalidate
      # another target's incremental artifacts even after source restoration.
      - name: Restore and verify final common-mechanism artifacts on all targets
        env:
          ACTQL_SESSION_COLLECT: 'true'
        run: node proofs/bounded-session/run.mjs all
      - name: Produce final serial chain evidence on all targets
        run: node proofs/relation-chain/run.mjs all
      - name: Produce conditional allocation capacity evidence on all targets
        run: node proofs/relation-capacity/run.mjs all
      - name: Check complete fresh and reused action inventory with Lean
        run: node proofs/ci-evidence/collect.mjs finish
      - name: Retain immutable action receipts for comparison and final check
        id: session-actions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: session-actions-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: .artifacts/session-actions/
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain exact-source evidence and mutation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bounded-session-evidence-${{ github.sha }}
          path: |
            .artifacts/bounded-session/
            .artifacts/relation-chain/
            .artifacts/relation-capacity/
          include-hidden-files: true
          if-no-files-found: error
  # Typed pipeline pilot remains beside the existing semantic/physical suites.
  # Isolated producers retain every campaign and never share source/build trees.
  # Evidence is from this run AND attempt; rerun all jobs after partial retries.
  # Fixed four-part plan: no matrix, shared mutable root or result reuse.
  pipeline-mutations:
    needs: [select-targets, preflight]
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && !inputs.performance_matrix && !inputs.packed_query_evidence_probe && needs.select-targets.outputs.profile == 'full' && needs.select-targets.outputs.deep_proofs == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ACTQL_PIPELINE_PART: L-M0
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
      artifact-digest: ${{ steps.evidence.outputs.artifact-digest }}
      archive-digest: ${{ steps.seal.outputs.archive-digest }}
      manifest-digest: ${{ steps.seal.outputs.manifest-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - name: Install audited Lean pin
        run: |
          node proofs/bounded-session/setup-lean.mjs
          echo "$GITHUB_WORKSPACE/.toolchains/lean-4.30.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Bind independently owned part to source and partition plan
        run: node proofs/relation-pipeline/ci-parts.mjs begin L-M0
