name: CI

# Read-only PR validation and full main integration. Manual performance and
# evidence probes remain separate modes, never release/deployment actions.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      packed_query_evidence_probe:
        description: Run only the intentionally failing evidence upload probes
        type: boolean
        default: false
      performance_matrix:
        description: Run the registered performance matrix at this revision
        type: boolean
        default: false
      performance_priority_node_mode:
        description: Priority Node samples; final is for a plausible fixed candidate
        type: choice
        options: [diagnostic, final]
        default: diagnostic
      performance_priority_python_mode:
        description: Priority Python samples; final is for a plausible fixed candidate
        type: choice
        options: [diagnostic, final]
        default: diagnostic
      performance_native_approval_only:
        description: Run only fixed Native approval samples from the exact Native package inputs
        type: boolean
        default: false
      performance_native_approval_runner:
        description: Hosted Local acceptance runner; Darwin remains a separate local campaign
        type: choice
        options: [ubuntu-24.04]
        default: ubuntu-24.04
      performance_package_run_id:
        description: Completed same-source normal CI run supplying existing Client tarballs
        type: string
        default: ''
      performance_package_artifact_id:
        description: Exact existing Client package artifact for the performance check
        type: string
        default: ''
      performance_native_package_run_id:
        description: Exact normal native package run id
        type: string
        default: ''
      performance_native_package_artifact_id:
        description: Exact normal native package artifact id
        type: string
        default: ''
      performance_python_package_run_id:
        description: Exact normal python package run id
        type: string
        default: ''
      performance_python_package_artifact_id:
        description: Exact normal python package artifact id
        type: string
        default: ''
      performance_process_package_jobs:
        description: JSON object naming the exact native and python normal package jobs
        type: string
        default: '{}'
      native_macos:
        description: Also run the macOS native diagnostic job
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.packed_query_evidence_probe && 'evidence-probe' || inputs.performance_matrix && 'performance' || 'normal' }}
  # Keep the active main integration; GitHub retains only the latest pending run.
  # Branch and performance groups cannot cancel normal main integration.
  cancel-in-progress: ${{ !inputs.performance_matrix && github.ref != 'refs/heads/main' }}

# Public repository validation uses only read permissions. Private/unknown
# visibility stays outside this workflow; no activation variable is required.
jobs:
  select-targets:
    permissions:
      contents: read
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.select.outputs.targets }}
      macos: ${{ steps.select.outputs.macos }}
      profile: ${{ steps.select.outputs.profile }}
      deep_proofs: ${{ steps.select.outputs.deep_proofs }}
      plan: ${{ steps.select.outputs.plan }}
      python_wheels: ${{ steps.select.outputs.python_wheels }}
      moon_test_selection: ${{ steps.select.outputs.moon_test_selection }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
      - name: Identify a regular Moon-only change before preparing graph tooling
        id: moon-candidate
        run: node scripts/ci-targets.mjs moon-graph-candidate
      - name: Install pinned Moon only for compiler-owned dependency discovery
        if: steps.moon-candidate.outputs.required == 'true'
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Select core targets without weakening evidence campaigns
        id: select
        env:
          NATIVE_MACOS: ${{ inputs.native_macos }}
        run: node scripts/ci-targets.mjs
  packed-query-evidence-probe:
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && (github.event_name == 'workflow_dispatch' && inputs.packed_query_evidence_probe) }}
    uses: ./.github/workflows/packed-query-evidence-probe.yml
  performance-matrix:
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && (github.event_name == 'workflow_dispatch' && inputs.performance_matrix && !inputs.packed_query_evidence_probe) }}
    uses: ./.github/workflows/performance-matrix.yml
    permissions:
      contents: read
      actions: read
    with:
      priority-node-mode: ${{ inputs.performance_priority_node_mode }}
      priority-python-mode: ${{ inputs.performance_priority_python_mode }}
      native-approval-only: ${{ inputs.performance_native_approval_only }}
      native-approval-runner: ${{ inputs.performance_native_approval_runner }}
      package-run-id: ${{ inputs.performance_package_run_id }}
      package-artifact-id: ${{ inputs.performance_package_artifact_id }}
      native-package-run-id: ${{ inputs.performance_native_package_run_id }}
      native-package-artifact-id: ${{ inputs.performance_native_package_artifact_id }}
      native-package-producer-job: ${{ fromJSON(inputs.performance_process_package_jobs || '{}').native || '' }}
      python-package-run-id: ${{ inputs.performance_python_package_run_id }}
      python-package-artifact-id: ${{ inputs.performance_python_package_artifact_id }}
      python-package-producer-job: ${{ fromJSON(inputs.performance_process_package_jobs || '{}').python || '' }}
  # Admission checks complete before any normal runtime/proof runner starts.
  preflight:
    needs: [select-targets]
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
      - name: Check all workflows with pinned actionlint
        run: |
          set -euo pipefail
          tool="$RUNNER_TEMP/actionlint-1.7.12"
          mkdir "$tool"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$tool/original.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$tool/original.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool/original.tar.gz" -C "$tool" actionlint
          # Keep this fixed workflow checker independent of optional unpinned external tools.
          "$tool/actionlint" -oneline -shellcheck= -pyflakes=
      - name: Reject inconsistent operation support and acceptance evidence before fan-out
        run: node --test scripts/pure-operation-inventory.test.mjs
      - name: Check Native diagnostic counter assignments before fan-out
        run: python3 scripts/test_native_timings.py CommandCounterMap
      - run: npm ci
      - name: Check runtime command inventory before fan-out
        run: >-
          node --input-type=module -e
          'import {runFocusedTests} from "./scripts/test-execution.mjs";
          process.exitCode=runFocusedTests("node",["--test-name-pattern","^check:.* retains its exact registered commands",
          "scripts/build-runtime-packages.test.mjs"],{cwd:process.cwd()});'
      - name: Test pipeline artifact and aggregate contracts
        run: node --test proofs/relation-pipeline/ci-artifacts.test.mjs
      - name: Check owned contract versions
        run: npm run check:contract-versions
      - name: Check specification metadata without updating it
        run: npm run check:metadata
      - name: Install pinned MoonBit
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - run: moon fmt --check
      - name: Check public interfaces
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node scripts/check-moonbit-api.mjs
      - name: Verify admission checks did not change tracked files
        run: git diff --exit-code
      - name: Admit the fixed main revision or reject superseded working revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-preflight.mjs
  # Remaining independent lint diagnostics run after mandatory admission.
  lint:
    needs: [select-targets, preflight]
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        with:
          python: 'true'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: ${{ startsWith(needs.select-targets.outputs.profile, 'draft') }}
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
        if: ${{ startsWith(needs.select-targets.outputs.profile, 'draft') }}
      - name: Test source-only Client wire contracts
        if: ${{ needs.select-targets.outputs.profile == 'full' }}
        run: node scripts/local-checks.mjs test node --timeout-seconds 120 --kill-grace-seconds 5 -- packages/client-wire/cancel-identity.test.mjs packages/client-wire/submission-check-semantics.test.mjs
      - name: Test source-only INFER evaluation contracts
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node scripts/local-checks.mjs test node --timeout-seconds 120 --kill-grace-seconds 5 -- examples/infer-evaluation/evaluate.test.mjs examples/infer-evaluation/compare-source-instructions.test.mjs
      - name: Type-check public SDK and Client wire declarations
        run: npm run check:client-types
      - name: Test original Source current control ownership
        run: node --test scripts/source-read-current-control.test.mjs
      - name: Test read-only worktree inventory fixtures
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/worktree-inventory.test.mjs
      - name: Test nonzero execution guards
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/test-execution.test.mjs
      - name: Test bounded local execution and optional hook adapters
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/local-checks.test.mjs scripts/local-checks-guard.test.mjs scripts/local-checks-policy.test.mjs scripts/local-checks-hook.test.mjs
      - name: Test environment guards
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/moonbit-environment.test.mjs
      - name: Test native SQLite namespace ownership
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/test-native-core.test.mjs scripts/native-query-coverage.test.mjs scripts/native-resident-phase-watchdog.test.mjs scripts/native-resident-function-diagnostic.test.mjs scripts/observation-ack-loss-proxy.test.mjs
      - name: Test preflight admission and latest-revision guard
        run: node --test scripts/ci-preflight.test.mjs
      - name: Test focused owning-family selection and zero-test guards
        run: node --test scripts/ci-focused-tests.test.mjs
      - name: Test conservative CI target selection
        run: node --test scripts/ci-targets.test.mjs scripts/ci-main-base.test.mjs
      - name: Test collection budget and required packed README selection
        run: node --test adapters/host-node/local-result-read-policy.test.mjs adapters/host-node/client-result-collection-policy.test.mjs adapters/host-node/request-memory-policy.test.mjs adapters/local-node/managed-advance-diagnostic.test.mjs scripts/packed-readme-ci.test.mjs
      - name: Test original Model failure and workflow observation
        run: node --test adapters/host-node/infer-model-effect-control.test.mjs adapters/host-node/acquired-effect-unknown-primary.test.mjs adapters/host-node/mock-project-effect-public.test.mjs adapters/host-common/observation.test.mjs
      - name: Test compiler-owned package selection and non-Moon input boundaries
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/ci-moon-test-plan.test.mjs
      - name: Test ordinary operation performance policy oracles
        run: node --test scripts/operation-performance.test.mjs scripts/operation-performance-policy.test.mjs scripts/native-approval-performance.test.mjs scripts/native-approval-cpu-diagnostic.test.mjs scripts/node-wait-cpu-diagnostic.test.mjs
      - name: Test ordinary operation performance assessment
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/benchmark-node-operations.test.mjs scripts/operation-performance-native-control.test.mjs scripts/benchmark-node-process-operations.test.mjs scripts/benchmark-node-sqlite.test.mjs scripts/benchmark-node-boundaries.test.mjs scripts/node-operation-fs-trace.test.mjs scripts/operation-performance-priority-transition.test.mjs scripts/operation-performance-transition-ci.test.mjs
      - name: Test ordinary process collector protocols
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: python3 -I -B scripts/benchmark-ordinary-processes.test.py
      - name: Test ordinary artifact reuse and controlled performance gate
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/ordinary-operation-packages.test.mjs
      - name: Test Client CI partition and aggregate requirements
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/client-ci.test.mjs scripts/native-cli-project-init.test.mjs scripts/native-cli-project-scaffold.test.mjs scripts/native-cli-linux-local-ci.test.mjs scripts/produce-native-cli-linux-local.test.mjs scripts/native-cli-source-free-install.test.mjs scripts/release-test-registry.test.mjs scripts/native-cli-linux-local-recipe.test.mjs scripts/ci-native-cli-installed.test.mjs scripts/native-cli-mock-scenario.test.mjs
      - name: Test plain-init Native numeric result and refusal oracles
        run: node --test scripts/native-cli-default-numeric.test.mjs
      - name: Test explicit release policy and publication refusal
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/release-policy.test.mjs scripts/release-version-schema.test.mjs scripts/release-set.test.mjs scripts/release-review.test.mjs scripts/release-promotion-review.test.mjs scripts/release-registry.test.mjs scripts/release-stage.test.mjs scripts/release-native-registry.test.mjs scripts/release-native-publish.test.mjs scripts/release-native-latest.test.mjs scripts/release-public-install.test.mjs scripts/release-python-install.test.mjs scripts/release-python-publish.test.mjs scripts/release-python-cold-verifier.test.mjs scripts/release-native-install.test.mjs scripts/release-lanes.test.mjs scripts/release-fixed-source.test.mjs scripts/native-standalone-release.test.mjs scripts/native-cli-version.test.mjs
      - name: Test cross-host Python release preparation without runtime loading
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: |
          python3 -m pip install --disable-pip-version-check -e ./packages/python-sdk
          python3 -B packages/python-sdk/tests/run.py --pattern test_release_packaging_target.py
      - name: Test normal Python wheel acceptance harness guards
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: python3 -B scripts/test_ci_python_wheels.py
      - name: Test bounded compiler crash metadata privacy controls
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: python3 -B scripts/test_native_compiler_diagnostics.py
      - name: Test Native preparation originals and bounded compiler orchestration
        run: node --test scripts/native-preparation-originals.test.mjs scripts/native-runtime-bundle-fixture.test.mjs scripts/native-preparation-lanes.test.mjs scripts/native-remote-runtime-isolation.test.mjs scripts/native-core-linux-common.test.mjs scripts/native-http-phases.test.mjs
      - name: Test CI lane coverage and bounded Native phase measurement
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/ci-balanced-lanes.test.mjs scripts/ci-session-lanes.test.mjs scripts/ci-native-lanes.test.mjs scripts/ci-native-background-groups.test.mjs scripts/native-core-measured-tests.test.mjs
      - name: Test read-only CI evidence reporting
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/ci-evidence.test.mjs
      - name: Test portable dependency inspection and injected violations
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/portable-core.test.mjs
      - name: Test dependency isolation scratch ownership
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/dependency-isolation-scratch.test.mjs
      # Source-only process/filesystem checks need no Client package or runtime.
      - name: Test owned scratch without Client runtime preparation
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node --test scripts/owned-scratch.test.mjs
      - name: Execute standard module subsets without DuckDB dependencies
        if: ${{ !startsWith(needs.select-targets.outputs.profile, 'draft') }}
        run: node scripts/check-node-without-duckdb.mjs
  focused-tests:
    needs: [select-targets, preflight]
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && !inputs.performance_matrix && !inputs.packed_query_evidence_probe && (needs.select-targets.outputs.profile == 'focused-tests' || needs.select-targets.outputs.profile == 'draft-focused') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
      - name: Install pinned MoonBit without unrelated native transport dependencies
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Check package and execute changed tests plus owning JS family
        env:
          CI_PLAN_PATH: ${{ runner.temp }}/actql-ci-plan.json
        run: |
          cat > "$CI_PLAN_PATH" <<'ACTQL_CI_PLAN_JSON'
          ${{ needs.select-targets.outputs.plan }}
          ACTQL_CI_PLAN_JSON
          node scripts/ci-focused-tests.mjs
      - name: Upload focused execution diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: focused-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build/focused-evidence
          if-no-files-found: warn
          retention-days: 7
  # Linux keeps both portable targets and eight complete Native common drivers.
  # Darwin retains its four ordinary and three physical profiles under a separate
  # four-job cap, leaving another macOS slot for the original long workloads.
  # Both matrices use the same step owner; Core requires their selected outcomes.
  core-common:
    needs: [select-targets, preflight]
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && !inputs.performance_matrix && !inputs.packed_query_evidence_probe && needs.select-targets.outputs.profile == 'full' }}
    name: core (${{ matrix.target }}${{ matrix.target == 'native' && format(' {0}', matrix.partition) || '' }})
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select-targets.outputs.targets) }}
        partition: ['1/4', 'linux-common-1/8', 'linux-common-2/8', 'linux-common-3/8', 'linux-common-4/8', 'linux-common-5/8', 'linux-common-6/8', 'linux-common-7/8', 'linux-common-8/8']
        exclude:
          - target: js
            partition: linux-common-1/8
          - target: js
            partition: linux-common-2/8
          - target: js
            partition: linux-common-3/8
          - target: js
            partition: linux-common-4/8
          - target: js
            partition: linux-common-5/8
          - target: js
            partition: linux-common-6/8
          - target: js
            partition: linux-common-7/8
          - target: js
            partition: linux-common-8/8
          - target: wasm
            partition: linux-common-1/8
          - target: wasm
            partition: linux-common-2/8
          - target: wasm
            partition: linux-common-3/8
          - target: wasm
            partition: linux-common-4/8
          - target: wasm
            partition: linux-common-5/8
          - target: wasm
            partition: linux-common-6/8
          - target: wasm
            partition: linux-common-7/8
          - target: wasm
            partition: linux-common-8/8
          - target: native
            partition: '1/4'
    runs-on: ubuntu-24.04
    # Native keeps its full 60-minute child after the separate cold checkpoint
    # producers, with time for original failure diagnostics and cleanup.
    timeout-minutes: ${{ matrix.target == 'native' && 90 || 30 }}
    steps: &core_steps
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      - name: Require the supported Core Native platform
        if: ${{ matrix.target == 'native' }}
        run: |
          if [[ "${{ matrix.partition }}" == linux-common-* ]]; then
            test "$(uname -s)" = Linux
            test "$(uname -m)" = x86_64
          else
            test "$(uname -s)" = Darwin
            test "$(uname -m)" = arm64
          fi
      - name: Test pinned Native C compiler orchestration
        if: ${{ matrix.target == 'native' && matrix.partition == '1/4' }}
        run: node --test scripts/native-core-c-compiler.test.mjs
      - name: Prepare pinned ordinary Native C object caching
        id: native-c-object-cache
        if: ${{ matrix.target == 'native' && contains(fromJSON('["1/4","2/4","3/4","4/4"]'), matrix.partition) }}
        env:
          CACHE_PARTITION: ${{ matrix.partition }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import {appendFileSync, chmodSync, lstatSync, mkdirSync, readFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {nativeCoreCCachePin as pin} from './scripts/native-core-c-compiler.mjs';
          const tool = join(process.env.RUNNER_TEMP, 'actql-core-ordinary-c-cache-tool');
          const cache = join(process.env.RUNNER_TEMP, 'actql-core-ordinary-c-cache');
          mkdirSync(tool, {mode: 0o700});
          mkdirSync(cache, {mode: 0o700});
          const archive = join(tool, 'original.tar.gz');
          execFileSync('/usr/bin/curl', ['--fail', '--location', '--silent', '--show-error',
            '--connect-timeout', '20', '--max-time', '60', pin.url, '--output', archive],
            {stdio: 'inherit', timeout: 65000});
          const hash = value => createHash('sha256').update(value).digest('hex');
          assert.equal(hash(readFileSync(archive)), pin.archiveSha256);
          execFileSync('/usr/bin/tar', ['-xzf', archive, '-C', tool, '--strip-components=1',
            `ccache-${pin.version}-darwin/ccache`], {stdio: 'inherit', timeout: 10000});
          const binary = join(tool, 'ccache'), stat = lstatSync(binary);
          assert(stat.isFile() && !stat.isSymbolicLink());
          assert.equal(hash(readFileSync(binary)), pin.binarySha256);
          chmodSync(binary, 0o700);
          execFileSync(binary, ['--version'], {stdio: 'inherit', timeout: 5000});
          const image = process.env.ImageVersion ?? 'unreported-image';
          assert(/^[A-Za-z0-9_.-]+$/u.test(image));
          assert(/^[1-4]\/4$/u.test(process.env.CACHE_PARTITION));
          const profile = hash(Buffer.concat([readFileSync('toolchain.json'),
            readFileSync('scripts/native-core-c-compiler.mjs')]));
