  pipeline-validation:
    needs: [select-targets, preflight]
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && !inputs.performance_matrix && !inputs.packed_query_evidence_probe && needs.select-targets.outputs.profile == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      tested-sha: ${{ steps.bind.outputs.tested-sha }}
      source-digest: ${{ steps.bind.outputs.source-digest }}
      plan-digest: ${{ steps.bind.outputs.plan-digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - name: Install audited Lean pin
        run: |
          node proofs/bounded-session/setup-lean.mjs
          echo "$GITHUB_WORKSPACE/.toolchains/lean-4.30.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Reject invalid pipeline scopes and shrinking substitutions exactly once
        run: |
          tests=()
          for test in proofs/relation-pipeline/*.test.mjs; do
            if [[ "$test" != proofs/relation-pipeline/ci-artifacts.test.mjs ]]; then tests+=("$test"); fi
          done
          node --test "${tests[@]}" proofs/relation-pipeline/capacity/*.test.mjs proofs/relation-pipeline/capacity/backing/*.test.mjs
      - name: Bind successful synthetic validation to this source and plan
        id: bind
        run: node proofs/relation-pipeline/ci-parts.mjs validation
  pipeline-evidence:
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && always() && !cancelled() && !inputs.performance_matrix && !inputs.packed_query_evidence_probe &&
      !(needs.pipeline-mutations.result == 'skipped' && needs.pipeline-mutations-rest.result == 'skipped' &&
        needs.pipeline-capacity.result == 'skipped' && needs.pipeline-capacity-mutants.result == 'skipped') }}
    needs: [pipeline-mutations, pipeline-mutations-rest, pipeline-capacity, pipeline-capacity-mutants, pipeline-validation]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.pipeline-actions.outputs.artifact-id }}
      artifact-digest: ${{ steps.pipeline-actions.outputs.artifact-digest }}
    steps:
      - name: Require all four producers and mandatory validation before transfer
        env:
          PIPELINE_NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const assert = require("node:assert/strict");
            const jobs = JSON.parse(process.env.PIPELINE_NEEDS);
            const names = ["pipeline-capacity", "pipeline-capacity-mutants", "pipeline-mutations", "pipeline-mutations-rest"];
            assert.deepEqual(Object.keys(jobs).sort(), [...names, "pipeline-validation"].sort());
            assert.equal(jobs["pipeline-validation"].result, "success", "Required synthetic validation did not succeed");
            const ids = [];
            for (const name of names) {
              const job = jobs[name];
              assert.equal(job.result, "success", `${name} failed, cancelled or skipped`);
              assert.match(job.outputs["artifact-id"] ?? "", /^[1-9][0-9]*$/);
              for (const key of ["artifact-digest", "archive-digest", "manifest-digest"])
                assert.match(job.outputs[key] ?? "", /^[0-9a-f]{64}$/);
              ids.push(job.outputs["artifact-id"]);
            }
            assert.equal(new Set(ids).size, 4, "Part artifacts must be distinct");
          '
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
      - name: Download exact L-M0 archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.pipeline-mutations.outputs.artifact-id }}
          path: ${{ runner.temp }}/pipeline-ci/L-M0
          merge-multiple: true
      - name: Download exact L-M1 archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.pipeline-mutations-rest.outputs.artifact-id }}
          path: ${{ runner.temp }}/pipeline-ci/L-M1
          merge-multiple: true
      - name: Download exact L-C0 archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.pipeline-capacity.outputs.artifact-id }}
          path: ${{ runner.temp }}/pipeline-ci/L-C0
          merge-multiple: true
      - name: Download exact L-C1 archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.pipeline-capacity-mutants.outputs.artifact-id }}
          path: ${{ runner.temp }}/pipeline-ci/L-C1
          merge-multiple: true
      - name: Validate every part before constructing the immutable complete union
        env:
          PIPELINE_NEEDS: ${{ toJSON(needs) }}
          PIPELINE_STAGING: ${{ runner.temp }}/pipeline-ci
        run: node proofs/relation-pipeline/ci-parts.mjs join
      - name: Install audited Lean pin for the complete fresh action plan
        run: |
          node proofs/bounded-session/setup-lean.mjs
          echo "$GITHUB_WORKSPACE/.toolchains/lean-4.30.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Audit complete independent execution records and seal the fresh action original
        run: node proofs/relation-pipeline/mutation-action-archive.mjs seal
      - name: Reject internally consistent whole-report target substitutions
        run: node proofs/relation-pipeline/audit-target-regression.mjs
      - name: Audit the complete structural capacity union
        run: node proofs/relation-pipeline/capacity/audit.mjs
      - name: Retain every capacity target, byte, edge, shrink and compiler negative
        run: node proofs/relation-pipeline/capacity/audit-target-regression.mjs
      - name: Retain exact-source original parts and derived audited evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relation-pipeline-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            .artifacts/relation-pipeline/
            .artifacts/pipeline-ci/join.json
            .artifacts/pipeline-ci/action-original.json
            .artifacts/relation-pipeline-target-regression/run-*/*.json
            .artifacts/relation-pipeline-target-regression/run-*/*.log
          include-hidden-files: true
          if-no-files-found: error
      - name: Retain small immutable mutation originals for the required consumer
        id: pipeline-actions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pipeline-actions-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            .artifacts/pipeline-ci/action-original.json
            .artifacts/relation-pipeline/fixed-mutations-L-M*.json
            .artifacts/relation-pipeline/mutations-L-M*.json
            .artifacts/relation-pipeline/L-M*.json
          include-hidden-files: true
