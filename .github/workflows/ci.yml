        run: node proofs/relation-pipeline/ci-parts.mjs begin L-C1
      - name: Execute this part's structural capacity obligations
        run: |
          node proofs/relation-pipeline/capacity/run.mjs all L-C1
          node proofs/relation-pipeline/ci-parts.mjs stage L-C1 capacity
      - name: Validate local obligations and seal restored closed evidence
        id: seal
