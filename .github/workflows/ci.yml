        run: |
          openssl_development="$(node -p 'const p=require("./packages/python-local-runtime/native/crypto-component/source.json").source_targets["x86_64-unknown-linux-gnu"].package; p.name+"="+p.version')"
          openssl_runtime="$(node -p 'const p=require("./packages/python-local-runtime/native/crypto-component/source.json").source_targets["x86_64-unknown-linux-gnu"].license.package; p.name+"="+p.version')"
          sudo apt-get update
          sudo apt-get install --yes "$openssl_development" "$openssl_runtime"
      # 2 sequential producers retain 900s each plus 30s caller allowance.
      # The enclosing window also retains metadata and cleanup time.
      - name: Prepare exact-source scoped Native commands and components once
        id: native-preparation
        timeout-minutes: 35
        run: node scripts/prepare-native-runtime-bundle-fixture.mjs --destination "${{ runner.temp }}/native-scoped-preparation-${{ matrix.profile }}" --entries bundle --seconds 900
      - name: Retain scoped Native preparation source and compiler receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-scoped-preparation-${{ github.job }}-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-scoped-preparation-${{ matrix.profile }}/**/*.json
            ${{ runner.temp }}/native-scoped-preparation-${{ matrix.profile }}/**/*.stdout
            ${{ runner.temp }}/native-scoped-preparation-${{ matrix.profile }}/**/*.stderr
          if-no-files-found: warn
          retention-days: 14
      - name: Verify native direct and outbound-only Store profiles
        env:
          ACTQL_TEST_NATIVE_NETWORK_PROFILE: ${{ matrix.profile }}
          ACTQL_TEST_SCRATCH_ROOT: ${{ runner.temp }}/actql-native-network-${{ matrix.profile }}
        run: |
          # Each required profile retains the full Native query compilation.
          # Match Core's compiler stack prerequisite in both independent jobs.
          ulimit -S -s 65536
          npm run check:native-separated-network
  workers:
    needs: [select-targets, preflight]
