            ${{ runner.temp }}/native-scoped-preparation/**/*.stderr
          if-no-files-found: warn
          retention-days: 14
      - name: Verify native macOS arm64 profile
        run: |
          test "$(uname -m)" = arm64
          moon version --all
          npm run check:native-retained-task-file
          ACTQL_TEST_SCRATCH_ROOT="$RUNNER_TEMP/actql-native" \
            npm run check:native-http-client
  python-wheels:
    needs: [select-targets, preflight]
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && !inputs.performance_matrix && !inputs.packed_query_evidence_probe && needs.select-targets.outputs.python_wheels == 'true' }}
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      - name: Require the supported normal wheel platform
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Build normal wheels and accept fresh installed Python consumers
        run: python3 -B scripts/ci-python-wheels.py --destination "$RUNNER_TEMP/python-wheel-acceptance"
      - name: Preserve wheel acceptance and step timing diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-wheel-acceptance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/python-wheel-acceptance/*.json
            ${{ runner.temp }}/python-wheel-acceptance/*.stdout
            ${{ runner.temp }}/python-wheel-acceptance/*.stderr
            ${{ runner.temp }}/python-wheel-acceptance/cohort/cohort.json
            ${{ runner.temp }}/python-wheel-acceptance/cohort/wheels/*.whl
            ${{ runner.temp }}/python-wheel-acceptance/image/image-receipt.json
            ${{ runner.temp }}/python-wheel-acceptance/artifact/producer.json
          if-no-files-found: error
          retention-days: 14
  native-separated-network:
    needs: [select-targets, preflight]
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && !inputs.performance_matrix && !inputs.packed_query_evidence_probe && needs.select-targets.outputs.profile == 'full' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            adapters/connectors/duckdb/node/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install pinned native DuckDB transport
        run: npm ci --prefix adapters/connectors/duckdb/node --ignore-scripts
      - name: Install pinned MoonBit
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Install existing scoped component producer dependencies
        run: python3 -m pip install --disable-pip-version-check httpx==0.28.1 rfc8785==0.1.4
      - name: Install isolated network tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 iptables curl
      - name: Select the original pinned Noble static Crypto inputs
        timeout-minutes: 5
        run: |
          openssl_development="$(node -p 'const p=require("./packages/python-local-runtime/native/crypto-component/source.json").source_targets["x86_64-unknown-linux-gnu"].package; p.name+"="+p.version')"
          openssl_runtime="$(node -p 'const p=require("./packages/python-local-runtime/native/crypto-component/source.json").source_targets["x86_64-unknown-linux-gnu"].license.package; p.name+"="+p.version')"
          sudo apt-get update
          sudo apt-get install --yes "$openssl_development" "$openssl_runtime"
      # 2 sequential producers retain 900s each plus 30s caller allowance.
      # The enclosing window also retains metadata and cleanup time.
      - name: Prepare exact-source scoped Native commands and components once
        timeout-minutes: 35
        run: node scripts/prepare-native-runtime-bundle-fixture.mjs --destination "${{ runner.temp }}/native-scoped-preparation" --entries bundle --seconds 900
      - name: Retain scoped Native preparation source and compiler receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-scoped-preparation-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/native-scoped-preparation/**/*.json
            ${{ runner.temp }}/native-scoped-preparation/**/*.stdout
            ${{ runner.temp }}/native-scoped-preparation/**/*.stderr
          if-no-files-found: warn
          retention-days: 14
      - name: Verify native direct and outbound-only Store profiles
        env:
          ACTQL_TEST_SCRATCH_ROOT: ${{ runner.temp }}/actql-native-network
        run: |
          # The same full Native query compilation runs before either route.
          # Match Core's compiler stack prerequisite; keep both routes.
          ulimit -S -s 65536
          npm run check:native-separated-network
