  client-packed:
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && !inputs.performance_matrix && !inputs.packed_query_evidence_probe && needs.select-targets.outputs.profile == 'full' }}
    needs: [select-targets, preflight, client-packages]
    runs-on: ubuntu-24.04
    name: client-packed (${{ matrix.group }})
    # Every group consumes the one same-run Client artifact. Private installed
    # applications, Stores and keys remain independently owned by each case.
    strategy:
      fail-fast: false
      matrix:
        group: [connectors, infer, query-portable, query-native]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      - name: Select the packed Native Graph compiler
        if: ${{ matrix.group == 'query-native' }}
        timeout-minutes: 5
        run: |
          bash scripts/ci-install-linux-clang.sh
          compiler_bin="$RUNNER_TEMP/packed-query-compiler"
          mkdir -m 700 "$compiler_bin"
          ln -s "$(realpath /usr/bin/clang-19)" "$compiler_bin/cc"
          ln -s "$(realpath /usr/bin/ar)" "$compiler_bin/ar"
          echo "$compiler_bin" >> "$GITHUB_PATH"
      - name: Download the exact Client package artifact
        id: client-inputs
        uses: ./.github/actions/download-client-packages
        with:
          artifact-id: ${{ needs.client-packages.outputs.artifact-id }}
          path: ${{ runner.temp }}/actql-client-packages
      - name: Test packed Local runtime assets
        if: ${{ matrix.group == 'connectors' && !cancelled() && steps.client-inputs.outcome == 'success' }}
        run: node scripts/test-packed-local-node-assets.mjs
      - name: Test packed Sheets
        if: ${{ matrix.group == 'connectors' && !cancelled() && steps.client-inputs.outcome == 'success' }}
        run: node scripts/test-packed-sheets.mjs
      - name: Test packed HubSpot record approval and original Saved
        if: ${{ matrix.group == 'connectors' && !cancelled() && steps.client-inputs.outcome == 'success' }}
        env:
          ACTQL_TEST_PRESERVE_SCRATCH: '1'
        run: node scripts/test-packed-hubspot-source.mjs --ci --approval
      - name: Test packed kintone record approval and original Saved
        if: ${{ matrix.group == 'connectors' && !cancelled() && steps.client-inputs.outcome == 'success' }}
        env:
          ACTQL_TEST_PRESERVE_SCRATCH: '1'
        run: node scripts/test-packed-hubspot-source.mjs --ci --kintone-approval
      - name: Test packed Salesforce mock approval and original Saved
        if: ${{ matrix.group == 'connectors' && !cancelled() && steps.client-inputs.outcome == 'success' }}
        env:
          ACTQL_TEST_PRESERVE_SCRATCH: '1'
        run: node scripts/test-packed-hubspot-source.mjs --ci --mock-salesforce-approval
      - name: Test packed HubSpot mock approval and original Saved
        if: ${{ matrix.group == 'connectors' && !cancelled() && steps.client-inputs.outcome == 'success' }}
        env:
          ACTQL_TEST_PRESERVE_SCRATCH: '1'
        run: node scripts/test-packed-hubspot-source.mjs --ci --mock-hubspot-approval
      - name: Test packed HubSpot Whole-input mock approval and original Saved
        id: packed-hubspot-whole
        if: ${{ matrix.group == 'connectors' && !cancelled() && steps.client-inputs.outcome == 'success' }}
        env:
          ACTQL_TEST_PRESERVE_SCRATCH: '1'
        run: node scripts/test-packed-hubspot-source.mjs --ci --mock-hubspot-whole-approval
      - name: Retain packed HubSpot Whole-input qualification and failure evidence
        if: matrix.group == 'connectors' && always() && steps.packed-hubspot-whole.outputs.evidence-directory != ''
        uses: ./.github/actions/upload-packed-query-evidence
        with:
          directory: ${{ steps.packed-hubspot-whole.outputs.evidence-directory }}
