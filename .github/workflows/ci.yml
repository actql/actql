name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install pinned MoonBit
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: npm run check:docs
      - run: moon fmt --check
      - name: Check and test common core
        run: |
          for target in js wasm native; do
            moon check --target "$target" --deny-warn
            moon test --target "$target" --deny-warn
          done
      - name: Check public interfaces
        run: node scripts/check-moonbit-api.mjs
      - name: Test environment guards
        run: node --test scripts/moonbit-environment.test.mjs
      - name: Test portable dependency inspection and injected violations
        run: node --test scripts/portable-core.test.mjs
  workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: adapters/workers/package-lock.json
      - run: npm ci --prefix adapters/workers --ignore-scripts
      - name: Install pinned MoonBit
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Record verification revision and runtime versions
        run: |
          git rev-parse HEAD
          uname -a
          node --version
          moon version --all
          npm ls --prefix adapters/workers
      - name: Check isolated Core closure in all targets
        run: node scripts/check-core-without-connectors.mjs
      - name: Build inspect and execute the Workers JS profile
        run: npm test --prefix adapters/workers
  duckdb-node:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: adapters/duckdb-node/package-lock.json
      - name: Install exact DuckDB transport dependencies
        run: npm ci --prefix adapters/duckdb-node --ignore-scripts
      - name: Install pinned MoonBit for generated SQL conformance
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Record Linux verification revision and environment
        run: |
          git rev-parse HEAD
          uname -a
          node --version
          moon version --all
          npm ls --prefix adapters/duckdb-node @duckdb/node-api
      - name: Check real DuckDB transport and owned resources
        run: npm test --prefix adapters/duckdb-node
      - name: Build fixture-independent acquisition Host entries
        run: npm run build:host --prefix adapters/duckdb-node
