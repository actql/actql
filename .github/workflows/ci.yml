              console.error(`macOS Native workload=${process.env.WORKLOAD_RESULT || "missing"}, HTTP=${process.env.HTTP_RESULT || "missing"}, Linux HTTP=${process.env.LINUX_HTTP_RESULT || "missing"}, Darwin Core=${process.env.DARWIN_CORE_RESULT || "missing"}`);
