name: CI

# Runs automatically for main, integration branches headed for main and
# pull requests. A working branch is checked on demand:
#   gh workflow run CI --ref <branch> [-f native_macos=true]
on:
  push:
    branches:
      - main
      - 'integration/**'
  pull_request:
  workflow_dispatch:
    inputs:
      packed_query_evidence_probe:
        description: Run only the intentionally failing evidence upload probes
        type: boolean
        default: false
      performance_matrix:
        description: Run the registered performance matrix at this revision
        type: boolean
        default: false
      native_macos:
        description: Also run the macOS native job (billed at ten times Linux)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.packed_query_evidence_probe && 'evidence-probe' || inputs.performance_matrix && 'performance' || 'normal' }}
  cancel-in-progress: ${{ !inputs.performance_matrix }}

jobs:
  packed-query-evidence-probe:
    if: github.event_name == 'workflow_dispatch' && inputs.packed_query_evidence_probe
    uses: ./.github/workflows/packed-query-evidence-probe.yml
  performance-matrix:
    if: github.event_name == 'workflow_dispatch' && inputs.performance_matrix && !inputs.packed_query_evidence_probe
    uses: ./.github/workflows/performance-matrix.yml
  # Quick checks that need no full test build: they report version, format,
  # interface and environment problems within minutes.
  lint:
    if: ${{ !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      - name: Check owned contract versions
        run: npm run check:contract-versions
      - run: moon fmt --check
      - name: Check public interfaces
        run: node scripts/check-moonbit-api.mjs
      - name: Type-check public SDK and Client wire declarations
        run: npm run check:client-types
      - name: Test read-only worktree inventory fixtures
        run: node --test scripts/worktree-inventory.test.mjs
      - name: Test nonzero execution guards
        run: node --test scripts/test-execution.test.mjs
      - name: Test environment guards
        run: node --test scripts/moonbit-environment.test.mjs
      - name: Test native SQLite namespace ownership
        run: node --test scripts/test-native-core.test.mjs
      - name: Test read-only CI evidence reporting
        run: node --test scripts/ci-evidence.test.mjs
      - name: Test portable dependency inspection and injected violations
        run: node --test scripts/portable-core.test.mjs
      - name: Test dependency isolation scratch ownership
        run: node --test scripts/owned-scratch.test.mjs scripts/dependency-isolation-scratch.test.mjs
      - name: Execute standard module subsets without DuckDB dependencies
        run: node scripts/check-node-without-duckdb.mjs
  # One runner per target: check, then test, each with --deny-warn, as
  # before. A target never shares a runner or _build with another.
  core:
    if: ${{ !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    name: core (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [js, wasm, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      - name: Check common core
        run: moon check --target "${{ matrix.target }}" --deny-warn
      - name: Check independent fixed Run materials identity
        run: node --test scripts/client-values-run-materials-vector.test.mjs
      # Measured on these 2-vCPU runners: the default left native test
      # execution on about one CPU; one job per CPU shortened execution on
      # every target with no change in memory. Building is unaffected.
      - name: Test common core
        run: |
          if [ "${{ matrix.target }}" = native ]; then
            export ACTQL_TEST_NATIVE_SQLITE_LIBRARY="${ACTQL_TEST_NATIVE_SQLITE_LIBRARY:-/usr/lib/x86_64-linux-gnu/libsqlite3.so.0}"
            # Reopen remains within a run; the full run below starts fresh.
            node scripts/test-native-core.mjs --deny-warn -p platform_native/trusted_clock
            node scripts/test-native-core.mjs --deny-warn -j "$(getconf _NPROCESSORS_ONLN)"
          else
            moon test --target "${{ matrix.target }}" --deny-warn -j "$(getconf _NPROCESSORS_ONLN)"
          fi
  # Conditional proof and correspondence evidence beside the existing gates.
  session-evidence:
    if: ${{ !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - name: Install audited Lean pin
        run: |
          node proofs/bounded-session/setup-lean.mjs
          echo "$GITHUB_WORKSPACE/.toolchains/lean-4.30.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Reject invalid evidence derivations
        run: node --test proofs/bounded-session/evidence.test.mjs proofs/bounded-session/proof-check.test.mjs
      - name: Produce conditional common-mechanism evidence beside existing gates
        run: node proofs/bounded-session/run.mjs all
      - name: Detect representative production mutations with replacement tests
        run: node proofs/bounded-session/mutations.mjs
      - name: Reject invalid serial chain derivations and weakened claims
        run: node --test proofs/relation-chain/evidence.test.mjs proofs/relation-chain/proof-check.test.mjs
      - name: Detect serial chain accounting and ownership mutations
        run: node proofs/relation-chain/mutations.mjs
      - name: Reject invalid allocation bounds and weakened capacity propositions
        run: node --test proofs/relation-capacity/model.test.mjs proofs/relation-capacity/evidence.test.mjs proofs/relation-capacity/proof-check.test.mjs
      - name: Check separate registered delayed-stop work regression
        run: node proofs/relation-capacity/repro-delayed-stop.mjs
      - name: Detect allocation reservation and identity mutations on JS
        run: node proofs/relation-capacity/mutations.mjs
      # Keep both evidence sets fresh: either mutation batch can invalidate
      # another target's incremental artifacts even after source restoration.
      - name: Restore and verify final common-mechanism artifacts on all targets
        run: node proofs/bounded-session/run.mjs all
      - name: Produce final serial chain evidence on all targets
        run: node proofs/relation-chain/run.mjs all
      - name: Produce conditional allocation capacity evidence on all targets
        run: node proofs/relation-capacity/run.mjs all
      - name: Retain exact-source evidence and mutation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bounded-session-evidence-${{ github.sha }}
          path: |
            .artifacts/bounded-session/
            .artifacts/relation-chain/
            .artifacts/relation-capacity/
          include-hidden-files: true
          if-no-files-found: error
  # Typed pipeline pilot remains beside the existing semantic/physical suites.
  pipeline-evidence:
    if: ${{ !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-toolchain
      - name: Install audited Lean pin
        run: |
          node proofs/bounded-session/setup-lean.mjs
          echo "$GITHUB_WORKSPACE/.toolchains/lean-4.30.0-rc1-linux/bin" >> "$GITHUB_PATH"
      - name: Reject invalid pipeline scopes and shrinking substitutions
        run: node --test proofs/relation-pipeline/*.test.mjs proofs/relation-pipeline/capacity/backing/*.test.mjs
      - name: Verify the three-operation baseline at this same source
        run: node proofs/relation-pipeline/run.mjs js base
      - name: Verify fixed and required fresh mutations with distinct target evidence
        run: node proofs/relation-pipeline/mutations.mjs verify
      - name: Verify conditional structural capacity, custody and same-resource shrinking on all targets
        run: node proofs/relation-pipeline/capacity/run.mjs all
      - name: Audit structural capacity evidence and reject target or unconditional-byte substitution
        run: |
          node proofs/relation-pipeline/capacity/audit.mjs
          node proofs/relation-pipeline/capacity/audit-target-regression.mjs
      - name: Restore and verify final registered pipelines on every target
        run: node proofs/relation-pipeline/run.mjs all
      - name: Audit independent execution records, shrink minima and marginal registration
        run: node proofs/relation-pipeline/audit.mjs
      - name: Reject internally consistent whole reports from another target at the audit entrypoint
        run: node proofs/relation-pipeline/audit-target-regression.mjs
      - name: Retain exact-source pipeline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relation-pipeline-evidence-${{ github.sha }}
          path: |
            .artifacts/relation-pipeline/
            .artifacts/relation-pipeline-target-regression/run-*/*.json
            .artifacts/relation-pipeline-target-regression/run-*/*.log
          include-hidden-files: true
          if-no-files-found: error
  # Host, authorization, Checkpoint and retained-state owners.
  host:
    if: ${{ !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      - name: Test bounded retained storage and process lifecycle
        run: npm run check:retained-boundary
      - name: Test publication object writer cleanup owner
        run: node --test adapters/store-local/object-writer-owner.test.mjs
      - name: Test retired Result cleanup owner
        run: node --test adapters/store-local/result-deletion-owner.test.mjs
      - name: Test retired metadata cleanup owner
        run: node --test adapters/store-local/metadata-deletion-owner.test.mjs
      - name: Test publication commit custody owner
        run: node --test adapters/store-local/publication-commit-owner.test.mjs
      - name: Test portable publication control with the durable Store
        run: npm run check:publication-runtime
      - name: Test retained experiment fixtures and timing assessment
        run: node --test benchmarks/retained-results/*.test.mjs
      - name: Test control-side process admission without DuckDB
        run: npm run check:process-capacity
      - name: Test durable Remote Site dispatch admission
        run: npm run check:remote-site-runtime
      - name: Test non-destructive SQLite format inspection
        run: node --test adapters/host-common/sqlite-format-inspection.test.mjs
      - name: Test durable Checkpoint journal and resumed dispatch admission
        run: npm run check:checkpoint-runtime
      - name: Test native retained task file ownership
        run: npm run check:native-retained-task-file
      - name: Test portable Remote Transfer owner package
        run: npm run check:transfer-core
      - name: Test portable Run Host compilation package
        run: npm run check:run-host-core
      - name: Build runtime packages without prebuilt bundles
        run: node scripts/test-runtime-package-build.mjs
      - name: Test packed Local runtime assets
        run: npm run check:local-node-assets
  # Public Client, packed distribution and the Salesforce Site.
  client:
    if: ${{ !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      # The packed acceptance scripts below install the same Client tarballs.
      # Pack them once (each pack runs the package's prepack build) and share
      # one npm cache; every script still installs into its own clean root.
      - name: Pack the Client packages once for this job
        run: |
          node scripts/packed-client-packages.mjs "$RUNNER_TEMP/actql-client-packages"
          echo "ACTQL_PACKED_CLIENT_PACKAGES=$RUNNER_TEMP/actql-client-packages" >> "$GITHUB_ENV"
          echo "ACTQL_TEST_NPM_CACHE=$RUNNER_TEMP/actql-npm-cache" >> "$GITHUB_ENV"
      - name: Test distribution Client wire, Host and packed Node assembly
        env:
          TMPDIR: ${{ github.workspace }}/_build
        run: npm run check:distribution-client
      - name: Test packed Embedded Local Checkpoint and Named Result
        run: npm run check:packed-embedded-checkpoint
      - name: Test packed single INFER capture and replay
        id: packed-infer
        run: node scripts/test-packed-single-infer.mjs
      - name: Retain packed single INFER evidence
        if: always() && steps.packed-infer.outputs.evidence-directory != ''
        uses: ./.github/actions/upload-packed-query-evidence
        with:
          directory: ${{ steps.packed-infer.outputs.evidence-directory }}
          name: packed-single-infer-${{ github.sha }}
      - name: Test raw public SQL and Pipe through packed Local and HTTP
        id: packed-query
        run: |
          node --test scripts/packed-query-evidence.test.mjs
          node scripts/test-packed-public-query.mjs
      - name: Retain packed public query evidence
        if: always() && steps.packed-query.outputs.evidence-directory != ''
        uses: ./.github/actions/upload-packed-query-evidence
        with:
          directory: ${{ steps.packed-query.outputs.evidence-directory }}
          name: packed-public-query-${{ github.sha }}
      - name: Test committed Result descriptions through packed Local and HTTP
        # The description path reads retained metadata, including empty Results.
        # It must be exercised from installed packages on both transports.
        run: node scripts/test-packed-result-description.mjs
        id: packed-result-description
      - name: Retain packed Result description evidence
        if: always() && steps.packed-result-description.outputs.evidence-directory != ''
        uses: ./.github/actions/upload-packed-query-evidence
        with:
          directory: ${{ steps.packed-result-description.outputs.evidence-directory }}
          name: packed-result-description-${{ github.sha }}
      - name: Test Salesforce Site Catalog and bounded query acquisition
        run: npm run check:salesforce-site
      - name: Count actual Effect Compute calls across recovery
        run: node adapters/connectors/salesforce/test/run-computation-probe.mjs
      - name: Count acquired Effect Compute calls across Host recovery
        run: node scripts/test-acquired-effect-computation-probe.mjs
      - name: Recover incomplete Effect capture custody after process death
        run: |
          for boundary in before-effect-source effect-source before-effect-capture effect-capture before-publication-private publication-private; do
            node scripts/test-effect-capture-host-crash.mjs "$boundary"
          done
          for boundary in effect-source effect-capture publication-private; do
            node scripts/test-effect-capture-crash.mjs "$boundary"
          done
  # Native storage, publication and control, and the Native retained path.
  native:
    if: ${{ !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'
      - name: Test Node-free native storage publication and control
        env:
          ACTQL_TEST_SCRATCH_ROOT: ${{ github.workspace }}/.native-tests
        run: npm run check:native-http-client
      - name: Test public packed Run materials against native resident Site
        id: packed-materials
        env:
          ACTQL_TEST_SCRATCH_ROOT: ${{ runner.temp }}/packed-resident-materials
        run: node scripts/test-packed-resident-materials.mjs
      - name: Retain packed resident materials evidence
        if: always() && steps.packed-materials.outputs.evidence-directory != ''
        uses: ./.github/actions/upload-packed-query-evidence
        with:
          directory: ${{ steps.packed-materials.outputs.evidence-directory }}
          name: packed-resident-materials-${{ github.sha }}
      - name: Test packed exact dispatch recovery against native resident Site
        id: packed-redelivery
        env:
          ACTQL_TEST_SCRATCH_ROOT: ${{ runner.temp }}/packed-resident-redelivery
        run: node scripts/test-packed-resident-materials.mjs --redelivery-only
      - name: Test packed Output report custody and ACK crash boundaries
        id: packed-output-report
        env:
          ACTQL_TEST_SCRATCH_ROOT: ${{ runner.temp }}/packed-output-report
        run: node scripts/test-packed-resident-materials.mjs --output-report-only
      - name: Retain packed Output report evidence
        if: always() && steps.packed-output-report.outputs.evidence-directory != ''
        uses: ./.github/actions/upload-packed-query-evidence
        with:
          directory: ${{ steps.packed-output-report.outputs.evidence-directory }}
          name: packed-output-report-${{ github.sha }}
      - name: Retain packed exact redelivery evidence
        if: always() && steps.packed-redelivery.outputs.evidence-directory != ''
        uses: ./.github/actions/upload-packed-query-evidence
        with:
          directory: ${{ steps.packed-redelivery.outputs.evidence-directory }}
          name: packed-resident-redelivery-${{ github.sha }}
      - name: Verify registered Native retained product path
        run: |
          moon build --target js --release
          moon build src/cmd/native_retained_case_probe --target native --release
          node benchmarks/retained-results/native-case-probe.mjs native-acquisition-full-validation-low-selectivity/narrow/100
          node benchmarks/retained-results/native-case-probe.mjs fixed-join-count-shrinking-intermediate/narrow/1000
          node benchmarks/retained-results/native-estimate-calibration.mjs \
            native-acquisition-full-validation-low-selectivity/narrow/1000 \
            native-acquisition-full-validation-low-selectivity/narrow/100 \
            "$RUNNER_TEMP/native-retained-calibration.json"
          ACTQL_NATIVE_CALIBRATION_PROFILE="$RUNNER_TEMP/native-retained-calibration.json" \
            node scripts/test-native-direct-pair.mjs
  # The single result: every required job succeeded. A failure, a
  # cancellation or an unexpected skip fails it; it runs even when a
  # dependency failed. The macOS job may be skipped only where it is not
  # scheduled (see its condition).
  check:
    if: ${{ always() && !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    needs: [lint, core, host, client, native, spec, session-evidence, pipeline-evidence, native-macos,
      native-separated-network, workers, connector-addition, duckdb-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ toJSON(needs) }}
          MACOS_SCHEDULED: >-
            ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
              (github.event_name == 'pull_request' && github.base_ref == 'main') ||
              (github.event_name == 'workflow_dispatch' && inputs.native_macos) }}
        run: |
          node -e '
            const results = JSON.parse(process.env.RESULTS);
            const macos = process.env.MACOS_SCHEDULED.trim() === "true";
            let failed = false;
            for (const [job, {result}] of Object.entries(results)) {
              const ok = result === "success" ||
                (job === "native-macos" && !macos && result === "skipped");
              console.log(`${ok ? "ok  " : "FAIL"} ${job}: ${result}`);
              if (!ok) failed = true;
            }
            if (failed) process.exit(1);
          '
  # Specifications, machine contracts, generated artifacts, boundaries and
  # documented examples.
  spec:
    if: ${{ !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install pinned MoonBit
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - run: npm run check:spec
      - name: Check strict Local resource boundary evidence
        run: npm run check:local-resource-completion
      - name: Check independently pinned execution authorization vectors
        run: npm run check:execution-authorization-vectors
      - name: Check specification metadata without updating it
        run: npm run check:metadata
      - name: Verify metadata checks did not change tracked files
        run: git diff --exit-code
  # macOS minutes cost ten times Linux ones: run for main, pull requests to
  # main, and on demand.
  native-macos:
    if: >-
      ${{ !inputs.performance_matrix && !inputs.packed_query_evidence_probe && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && github.base_ref == 'main') ||
        (github.event_name == 'workflow_dispatch' && inputs.native_macos)) }}
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            adapters/connectors/duckdb/node/package-lock.json
      - run: npm ci
      - name: Install pinned native DuckDB transport
        run: npm ci --prefix adapters/connectors/duckdb/node --ignore-scripts
      - name: Install pinned MoonBit
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Verify native macOS arm64 profile
        run: |
          test "$(uname -m)" = arm64
          moon version --all
          npm run check:native-retained-task-file
          ACTQL_TEST_SCRATCH_ROOT="$RUNNER_TEMP/actql-native" \
            npm run check:native-http-client
  native-separated-network:
    if: ${{ !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            adapters/connectors/duckdb/node/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install pinned native DuckDB transport
        run: npm ci --prefix adapters/connectors/duckdb/node --ignore-scripts
      - name: Install pinned MoonBit
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Install isolated network tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes iproute2 iptables curl
      - name: Verify native direct and outbound-only Store profiles
        env:
          ACTQL_TEST_SCRATCH_ROOT: ${{ runner.temp }}/actql-native-network
        run: npm run check:native-separated-network
  workers:
    if: ${{ !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: adapters/workers/package-lock.json
      - run: npm ci --prefix adapters/workers --ignore-scripts
      - name: Install pinned MoonBit
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Record verification revision and runtime versions
        run: |
          git rev-parse HEAD
          uname -a
          node --version
          moon version --all
          npm ls --prefix adapters/workers
      - name: Check generated Workers fixtures
        run: node scripts/workers-fixtures.mjs
      - name: Check isolated Core closure in all targets
        run: node scripts/check-core-without-connectors.mjs
      - name: Build inspect and execute the Workers JS profile
        run: npm test --prefix adapters/workers
  connector-addition:
    if: ${{ !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: adapters/connectors/duckdb/node/package-lock.json
      - run: npm ci --prefix adapters/connectors/duckdb/node --ignore-scripts
      - name: Install pinned MoonBit
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Record fixed source and tools
        run: |
          git rev-parse HEAD
          uname -a
          node --version
          moon version --all
          npm ls --prefix adapters/connectors/duckdb/node
      - name: Verify independent Connector addition without common changes
        env:
          ACTQL_CONNECTOR_ADDITION_ARTIFACTS: _build/connector-addition-artifacts
        run: npm run check:connector-addition
      - name: Preserve dependency digests and execution logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: connector-addition-${{ github.sha }}
          path: _build/connector-addition-artifacts
          if-no-files-found: warn
          retention-days: 14
  duckdb-node:
    if: ${{ !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: adapters/connectors/duckdb/node/package-lock.json
      - name: Install exact DuckDB transport dependencies
        run: npm ci --prefix adapters/connectors/duckdb/node --ignore-scripts
      - name: Install pinned MoonBit for generated SQL conformance
        run: |
          node scripts/setup-moonbit.mjs
          toolchain="$GITHUB_WORKSPACE/.toolchains/moonbit-$(node -p "require('./toolchain.json').version")"
          echo "MOON_HOME=$toolchain" >> "$GITHUB_ENV"
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - name: Record Linux verification revision and environment
        run: |
          git rev-parse HEAD
          uname -a
          node --version
          moon version --all
          npm ls --prefix adapters/connectors/duckdb/node @duckdb/node-api
      - name: Check real DuckDB transport and owned resources
        run: npm test --prefix adapters/connectors/duckdb/node
      - name: Check paired performance provenance
        run: node --test adapters/connectors/duckdb/node/bench/matched-equivalent-pair.test.mjs
      - name: Build fixture-independent acquisition Host entries
        run: npm run build:host --prefix adapters/connectors/duckdb/node
