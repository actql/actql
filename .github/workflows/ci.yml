            --output "$RUNNER_TEMP/native-cli-linux-local/production" \
            --clang "$(realpath /usr/bin/clang-19)" \
            --sqlite-archive "$RUNNER_TEMP/native-cli-linux-local/inputs/sqlite.zip" \
            --openssl-package-archive "$RUNNER_TEMP/native-cli-linux-local/inputs/libssl-dev.deb" \
