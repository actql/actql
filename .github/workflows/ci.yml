  # Require the existing push-only monitor result; its timing warnings remain nonblocking.
  health-quick:
    needs: [client-packages]
    if: ${{ github.event.repository.visibility == 'public' && toJSON(github.event.repository.private) == 'false' && always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && !inputs.performance_matrix && !inputs.packed_query_evidence_probe }}
    uses: ./.github/workflows/health-monitor.yml
    permissions:
