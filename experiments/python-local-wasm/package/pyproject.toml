[build-system]
requires = ["setuptools==80.10.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"
[project]
name = "actql-local-wasm-probe"
version = "0.0.0.dev0"
requires-python = ">=3.11"
dependencies = ["wasmtime==38.0.0", "duckdb==1.4.1"]
[tool.setuptools.package-data]
actql_local_probe = ["core.wasm", "artifact.json"]
